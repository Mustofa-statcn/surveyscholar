<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17403a">
<title>SurveyScholar</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{
  --paper:#f4f3ef; --card:#ffffff; --ink:#14201d; --ink-2:#5d6b66;
  --line:#dfded7; --line-2:#ecebe5;
  --accent:#17403a; --accent-fg:#ffffff; --accent-soft:#e4ede9; --accent-soft-fg:#0d2a26;
  --pending:#8a5b00; --pending-bg:#fbf1dc;
  --fail:#a02620; --fail-bg:#fbe7e5;
  --ok:#1d6b4f; --ok-bg:#e2f0e8;
  --r:12px; --r-lg:18px;
  --pad:16px;
  --shadow:0 1px 2px rgba(20,32,29,.06), 0 8px 24px -16px rgba(20,32,29,.35);
  color-scheme:light;
}
/* one dark palette, reachable two ways: the device setting, or the in-app toggle */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#111614; --card:#182120; --ink:#e9ece9; --ink-2:#97a49f;
    --line:#2b3634; --line-2:#222c2a;
    --accent:#7fc5ae; --accent-fg:#0f1614; --accent-soft:#1d2c28; --accent-soft-fg:#7fc5ae;
    --pending:#e0b062; --pending-bg:#2e2617;
    --fail:#f0928b; --fail-bg:#33201e;
    --ok:#7fc5ae; --ok-bg:#1b2b26;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -16px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#111614; --card:#182120; --ink:#e9ece9; --ink-2:#97a49f;
  --line:#2b3634; --line-2:#222c2a;
  --accent:#7fc5ae; --accent-fg:#0f1614; --accent-soft:#1d2c28; --accent-soft-fg:#7fc5ae;
  --pending:#e0b062; --pending-bg:#2e2617;
  --fail:#f0928b; --fail-bg:#33201e;
  --ok:#7fc5ae; --ok-bg:#1b2b26;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -16px rgba(0,0,0,.8);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--paper);color:var(--ink)}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
#root{min-height:100dvh}
.wrap{max-width:560px;margin:0 auto;padding:0 var(--pad) 96px}
h1,h2,h3{margin:0;font-weight:640;letter-spacing:-.01em;line-height:1.25}
h1{font-size:22px}
h2{font-size:17px}
h3{font-size:15px}
p{margin:0}
.muted{color:var(--ink-2)}
.small{font-size:13px}
.tiny{font-size:12px}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}

/* header */
.topbar{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line-2)}
.topbar-in{max-width:560px;margin:0 auto;padding:14px var(--pad) 12px;display:flex;align-items:baseline;gap:10px}
.brand{font-weight:680;letter-spacing:-.02em;font-size:19px}
.brand span{color:var(--accent)}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{appearance:none;border:0;background:none;color:var(--ink-2);padding:9px 2px 10px;display:flex;flex-direction:column;
  align-items:center;gap:3px;font-size:11px;font-weight:560;cursor:pointer}
.tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--accent)}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px}
.card + .card{margin-top:12px}
.row{display:flex;align-items:center;gap:10px}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.stack{display:flex;flex-direction:column;gap:12px}
.stack-sm{display:flex;flex-direction:column;gap:8px}
.sep{height:1px;background:var(--line-2);margin:14px -16px}

/* buttons */
button{font:inherit}
.btn{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:var(--r);
  padding:11px 14px;font-weight:580;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:44px}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn-danger{color:var(--fail);border-color:var(--line)}
.btn-ghost{border-color:transparent;background:transparent;color:var(--accent);padding:8px 6px;min-height:38px}
.btn-block{width:100%}
.btn-sm{min-height:36px;padding:7px 11px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.iconbtn{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink-2);width:38px;height:38px;
  border-radius:10px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.iconbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* fab */
.fab{position:fixed;right:max(16px,calc(50% - 280px + 16px));bottom:calc(72px + env(safe-area-inset-bottom));z-index:25;
  height:56px;padding:0 20px;border-radius:28px;background:var(--accent);color:var(--accent-fg);border:0;
  font-weight:640;font-size:16px;display:inline-flex;align-items:center;gap:8px;box-shadow:var(--shadow);cursor:pointer}
.fab svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}

/* fields */
label.field{display:block}
.lbl{display:block;font-weight:580;font-size:15px;margin-bottom:7px}
.req{color:var(--fail);margin-left:3px}
input[type=text],input[type=number],input[type=date],input[type=url],textarea,select{
  width:100%;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:var(--r);
  padding:11px 12px;font:inherit;min-height:46px}
textarea{min-height:104px;resize:vertical}
select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%235d6b66' stroke-width='2' stroke-linecap='round'><path d='M6 9l6 6 6-6'/></svg>");
  background-repeat:no-repeat;background-position:right 12px center;background-size:18px;padding-right:38px}
input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible,.opt:focus-within{
  outline:2px solid var(--accent);outline-offset:1px}
.invalid input,.invalid textarea,.invalid select,.invalid .opts{border-color:var(--fail)}
.err{color:var(--fail);font-size:13px;margin-top:6px}
.opts{display:flex;flex-direction:column;gap:2px}
.opt{display:flex;align-items:center;gap:11px;padding:11px 12px;border:1px solid var(--line);border-radius:var(--r);
  background:var(--card);cursor:pointer;min-height:46px}
.opt input{accent-color:var(--accent);width:20px;height:20px;margin:0;flex:none}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.scale{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.scale button{flex:none;min-width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);
  color:var(--ink);font-weight:600;cursor:pointer}
.scale button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.qimg{width:100%;border-radius:var(--r);border:1px solid var(--line);margin-bottom:10px;display:block}
.thumb{width:100%;max-height:220px;object-fit:cover;border-radius:var(--r);border:1px solid var(--line)}

/* badges */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;
  border:1px solid transparent;white-space:nowrap}
.badge.local{background:var(--pending-bg);color:var(--pending)}
.badge.synced{background:var(--ok-bg);color:var(--ok)}
.badge.failed{background:var(--fail-bg);color:var(--fail)}
.badge.plain{background:var(--line-2);color:var(--ink-2)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor}

/* list */
.entry{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-top:1px solid var(--line-2)}
.entry:first-child{border-top:0}
.eid{font-size:16px;font-weight:620;letter-spacing:.02em}

/* hero number */
.hero{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px 18px 18px}
.hero .big{font-size:60px;line-height:1;font-weight:660;letter-spacing:-.035em;color:var(--accent)}
.bar{height:10px;border-radius:5px;background:var(--line-2);overflow:hidden;margin-top:12px}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:5px;transition:width .35s ease}

/* sheet (full-screen, never overlaps page content) */
.sheet{position:fixed;inset:0;z-index:60;background:var(--paper);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top)}
.sheet-head{position:sticky;top:0;background:var(--paper);border-bottom:1px solid var(--line-2);z-index:2}
.sheet-head-in{max-width:560px;margin:0 auto;padding:10px var(--pad);display:flex;align-items:center;gap:10px}
.sheet-head h2{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet-body .wrap{padding-bottom:110px}
.sheet-foot{border-top:1px solid var(--line);background:var(--card);padding:12px var(--pad) calc(12px + env(safe-area-inset-bottom))}
.sheet-foot-in{max-width:560px;margin:0 auto;display:flex;gap:10px}

/* dialog */
.scrim{position:fixed;inset:0;z-index:90;background:rgba(10,16,15,.55);display:flex;align-items:center;justify-content:center;padding:20px}
.dialog{background:var(--card);border-radius:var(--r-lg);max-width:420px;width:100%;padding:20px;box-shadow:var(--shadow)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));z-index:95;
  background:var(--accent);color:var(--accent-fg);padding:11px 16px;border-radius:12px;font-weight:580;font-size:14px;
  max-width:92vw;box-shadow:var(--shadow);text-align:center}
.banner{border-radius:var(--r);padding:11px 13px;font-size:14px;border:1px solid var(--line)}
.banner.warn{background:var(--pending-bg);color:var(--pending);border-color:transparent}
.banner.info{background:var(--accent-soft);color:var(--accent-soft-fg);border-color:transparent}
.empty{text-align:center;padding:34px 10px;color:var(--ink-2)}
.qcard{border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--card);margin-bottom:10px}
.qcard.active{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.grab{cursor:grab;touch-action:none}
.drag-over{border-color:var(--accent);background:var(--accent-soft)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:13px;background:var(--card);color:var(--ink-2);cursor:pointer}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-soft-fg)}
pre.code{background:var(--line-2);border-radius:var(--r);padding:12px;overflow-x:auto;font-size:12px;line-height:1.45;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre;margin:0}
.sect{margin:22px 0 2px;padding:0 2px}
.sect:first-child{margin-top:6px}
.sect h2{font-size:18px;letter-spacing:-.015em}
.sect .rule{height:2px;background:var(--accent);opacity:.5;border-radius:1px;margin:8px 0 0;width:44px}
.sect p{margin-top:6px}
.cond{border-left:3px solid var(--accent-soft);padding-left:11px;margin-left:1px}
.cond-note{font-size:12px;color:var(--accent-soft-fg);background:var(--accent-soft);border-radius:8px;
  padding:4px 9px;display:inline-block;margin-bottom:6px}
.theme-btn{margin-left:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<body>
<div id="root"></div>
<noscript>SurveyScholar needs JavaScript enabled.</noscript>
<script>
(function(){
  try{
    var t=localStorage.getItem('ss-theme');
    if(t==='dark'||t==='light') document.documentElement.setAttribute('data-theme',t);
  }catch(e){}
})();
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" crossorigin></script>
<script>
(function(){
"use strict";
var html = htm.bind(React.createElement);
var useState=React.useState, useEffect=React.useEffect, useRef=React.useRef,
    useMemo=React.useMemo, useCallback=React.useCallback;

/* ============================ utils ============================ */
function uid(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,10);
}
function nowISO(){ return new Date().toISOString(); }
function fmtDT(iso){
  if(!iso) return '';
  try{ return new Date(iso).toLocaleString(undefined,{year:'2-digit',month:'short',day:'2-digit',hour:'2-digit',minute:'2-digit'}); }
  catch(e){ return iso; }
}
function fmtDate(iso){ try{ return new Date(iso).toLocaleDateString(); }catch(e){ return iso; } }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
/* theme: 'system' follows the device, 'light'/'dark' pin it. Stored per device,
   outside IndexedDB, so it can be applied before the first paint. */
function readTheme(){
  try{ var t=localStorage.getItem('ss-theme'); return (t==='dark'||t==='light')?t:'system'; }catch(e){ return 'system'; }
}
function applyTheme(mode){
  var el=document.documentElement;
  if(mode==='system'){ el.removeAttribute('data-theme'); try{ localStorage.removeItem('ss-theme'); }catch(e){} }
  else { el.setAttribute('data-theme',mode); try{ localStorage.setItem('ss-theme',mode); }catch(e){} }
  var meta=document.querySelector('meta[name=theme-color]');
  if(meta) meta.setAttribute('content', effectiveTheme(mode)==='dark'?'#111614':'#17403a');
  return mode;
}
function systemPrefersDark(){
  return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
}
function effectiveTheme(mode){ return mode==='system'?(systemPrefersDark()?'dark':'light'):mode; }
function download(blob, name){
  var a=document.createElement('a'), u=URL.createObjectURL(blob);
  a.href=u; a.download=name; document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(u); a.remove(); }, 400);
}
var TYPES=[
  ['section','Section heading'],
  ['short_text','Short answer'],['long_text','Paragraph'],['multiple_choice','Multiple choice (one)'],
  ['checkbox','Checkboxes (many)'],['dropdown','Dropdown'],['linear_scale','Linear scale'],
  ['date','Date'],['number','Number'],['image_upload','Photo']
];
function typeLabel(t){ for(var i=0;i<TYPES.length;i++) if(TYPES[i][0]===t) return TYPES[i][1]; return t; }
function isChoice(t){ return t==='multiple_choice'||t==='checkbox'||t==='dropdown'; }
function isSection(t){ return t==='section'; }
/* a section carries no answer, so it is never validated, exported or synced as a column */
function answerable(list){ return (list||[]).filter(function(q){ return !isSection(q.type); }); }
function byOrder(a,b){ return (a.order||0)-(b.order||0); }

/* ---- conditional display ----
   A condition always points at an EARLIER question, which makes cycles impossible
   and lets one ordered pass resolve the whole chain. */
var COND_OPS=[['any','is one of'],['none','is not one of'],['answered','has any answer']];
function condOpLabel(op){ for(var i=0;i<COND_OPS.length;i++) if(COND_OPS[i][0]===op) return COND_OPS[i][1]; return 'is one of'; }
function hasAnswer(v){ return !(v===undefined||v===null||v===''||(Array.isArray(v)&&v.length===0)); }
function conditionMet(cond, answers){
  if(!cond || !cond.q) return true;
  var v=(answers||{})[cond.q];
  if(!hasAnswer(v)) return cond.op==='none' ? false : false;
  if(cond.op==='answered') return true;
  var want=(cond.values||[]).map(String);
  var mine=Array.isArray(v)?v.map(String):[String(v)];
  var hit=mine.some(function(x){ return want.indexOf(x)>=0; });
  return cond.op==='none' ? !hit : hit;
}
/* Visible elements in order. A hidden section hides everything under it until the next
   section, and a hidden question's own answer stops counting for anything below it. */
function visibleElements(questions, answers){
  var live=Object.assign({},answers||{}), out=[], sectionHidden=false;
  (questions||[]).slice().sort(byOrder).forEach(function(q){
    var ok=conditionMet(q.showIf,live);
    if(isSection(q.type)){ sectionHidden=!ok; if(ok) out.push(q); return; }
    if(sectionHidden||!ok){ delete live[q.id]; return; }
    out.push(q);
  });
  return out;
}
function visibleQuestions(questions, answers){ return answerable(visibleElements(questions,answers)); }
/* Answers belonging to hidden questions never get saved, exported or synced. */
function pruneHiddenAnswers(questions, answers){
  var keep={};
  visibleQuestions(questions,answers).forEach(function(q){ keep[q.id]=1; });
  var out={};
  Object.keys(answers||{}).forEach(function(k){ if(keep[k]) out[k]=answers[k]; });
  return out;
}
function condSummary(q, questions){
  if(!q.showIf||!q.showIf.q) return '';
  var parent=(questions||[]).filter(function(x){ return x.id===q.showIf.q; })[0];
  var name=parent?(parent.label||'a question'):'a removed question';
  if(q.showIf.op==='answered') return 'Shown once “'+name+'” is answered';
  return 'Shown when “'+name+'” '+condOpLabel(q.showIf.op)+': '+(q.showIf.values||[]).join(', ');
}
/* Drops conditions that can no longer hold: parent deleted, parent moved after the child,
   or parent turned into a section. Returns what it cleared so the user can be told. */
function sanitizeConditions(questions){
  var list=(questions||[]).slice().sort(byOrder).map(function(q,i){ return Object.assign({},q,{order:i}); });
  var seen={}, cleared=[];
  list.forEach(function(q){
    if(q.showIf && q.showIf.q){
      var ok=seen[q.showIf.q];
      if(!ok){ delete q.showIf; cleared.push(q.label||'Untitled question'); }
    }
    if(!isSection(q.type)) seen[q.id]=1;
  });
  return {questions:list, cleared:cleared};
}

/* ============================ IndexedDB ============================ */
var DB_NAME='surveyscholar', DB_VER=1, _db=null;
var STORES=['questionnaires','versions','responses','counters','settings','drafts'];
function openDB(){
  if(_db) return Promise.resolve(_db);
  return new Promise(function(res,rej){
    var req=indexedDB.open(DB_NAME,DB_VER);
    req.onupgradeneeded=function(){
      var db=req.result;
      if(!db.objectStoreNames.contains('questionnaires')) db.createObjectStore('questionnaires',{keyPath:'id'});
      if(!db.objectStoreNames.contains('versions')) db.createObjectStore('versions',{keyPath:'key'});
      if(!db.objectStoreNames.contains('responses')){
        var r=db.createObjectStore('responses',{keyPath:'entryId'});
        r.createIndex('by_q','questionnaireId',{unique:false});
        r.createIndex('by_sync','syncStatus',{unique:false});
      }
      if(!db.objectStoreNames.contains('counters')) db.createObjectStore('counters',{keyPath:'year'});
      if(!db.objectStoreNames.contains('settings')) db.createObjectStore('settings',{keyPath:'key'});
      if(!db.objectStoreNames.contains('drafts')) db.createObjectStore('drafts',{keyPath:'id'});
    };
    req.onsuccess=function(){ _db=req.result; res(_db); };
    req.onerror=function(){ rej(req.error); };
  });
}
function tx(stores, mode, work){
  return openDB().then(function(db){
    return new Promise(function(res,rej){
      var t=db.transaction(stores,mode), out;
      var api={};
      stores.forEach(function(s){ api[s]=t.objectStore(s); });
      try{ out=work(api,t); }catch(e){ try{t.abort();}catch(_){ } return rej(e); }
      t.oncomplete=function(){ res(typeof out==='function'?out():out); };
      t.onerror=function(){ rej(t.error); };
      t.onabort=function(){ rej(t.error||new Error('Transaction aborted')); };
    });
  });
}
function rq(request){ return new Promise(function(res,rej){ request.onsuccess=function(){res(request.result);}; request.onerror=function(){rej(request.error);}; }); }
function dbGet(store,key){ return openDB().then(function(db){ return rq(db.transaction(store).objectStore(store).get(key)); }); }
function dbAll(store){ return openDB().then(function(db){ return rq(db.transaction(store).objectStore(store).getAll()); }); }
function dbPut(store,val){ return tx([store],'readwrite',function(a){ a[store].put(val); return val; }); }
function dbDel(store,key){ return tx([store],'readwrite',function(a){ a[store].delete(key); }); }
function responsesFor(qid){
  return openDB().then(function(db){
    var idx=db.transaction('responses').objectStore('responses').index('by_q');
    return rq(idx.getAll(IDBKeyRange.only(qid)));
  });
}

/* ---- settings ---- */
function getSettings(){
  return dbAll('settings').then(function(rows){
    var s={interviewer:'', sheetUrl:'', activeQuestionnaireId:null};
    rows.forEach(function(r){ s[r.key]=r.value; });
    return s;
  });
}
function setSetting(key,value){ return dbPut('settings',{key:key,value:value}); }

/* ---- entry id: generated inside one transaction (no collisions) ---- */
function createResponse(base){
  return tx(['counters','responses'],'readwrite',function(a){
    var year=new Date().getFullYear(), yy=String(year).slice(-2), entryId=null;
    a.counters.get(year).onsuccess=function(ev){
      var cur=ev.target.result ? ev.target.result.seq : 0;
      var next=cur+1;
      entryId=yy+String(next).padStart(5,'0');
      a.counters.put({year:year, seq:next});
      var rec=Object.assign({},base,{entryId:entryId});
      a.responses.add(rec); // .add -> aborts tx on duplicate key, counter rolls back
    };
    return function(){ return entryId; };
  });
}
function updateResponse(entryId, patch){
  return tx(['responses'],'readwrite',function(a,t){
    var saved=null, missing=false;
    a.responses.get(entryId).onsuccess=function(ev){
      var cur=ev.target.result;
      if(!cur){ missing=true; t.abort(); return; }
      saved=Object.assign({},cur,patch,{entryId:entryId, createdAt:cur.createdAt});
      a.responses.put(saved);
    };
    return function(){ return saved; };
  }).catch(function(e){
    throw new Error('Entry '+entryId+' could not be updated: '+(e&&e.message?e.message:'not found'));
  });
}
/* keep the counter ahead of any restored data */
function repairCounters(){
  return dbAll('responses').then(function(rows){
    var max={};
    rows.forEach(function(r){
      var yy=String(r.entryId).slice(0,2), seq=parseInt(String(r.entryId).slice(2),10);
      var year=2000+parseInt(yy,10);
      if(!isNaN(seq)) max[year]=Math.max(max[year]||0,seq);
    });
    var years=Object.keys(max);
    if(!years.length) return;
    return tx(['counters'],'readwrite',function(a){
      years.forEach(function(y){
        var year=parseInt(y,10);
        a.counters.get(year).onsuccess=function(ev){
          var cur=ev.target.result?ev.target.result.seq:0;
          if(max[year]>cur) a.counters.put({year:year,seq:max[year]});
        };
      });
    });
  });
}

/* ---- soft delete ---- */
var PURGE_DAYS=30;
function isLive(r){ return !r.isDeleted; }
function liveOnly(list){ return (list||[]).filter(isLive); }
function softDelete(entryId){
  var t=nowISO();
  return updateResponse(entryId,{isDeleted:true, deletedAt:t, updatedAt:t, syncStatus:'local', syncError:null});
}
function restoreEntry(entryId){
  var t=nowISO();
  return updateResponse(entryId,{isDeleted:false, deletedAt:null, updatedAt:t, syncStatus:'local', syncError:null});
}
function daysSince(iso){
  if(!iso) return 0;
  return (Date.now()-new Date(iso).getTime())/86400000;
}
/* physically removed only after 30 days AND once the deletion reached the sheet */
function purgeOldDeleted(hasSheet){
  return dbAll('responses').then(function(rows){
    var gone=rows.filter(function(r){
      return r.isDeleted && (r.syncStatus==='synced' || !hasSheet) && daysSince(r.deletedAt)>PURGE_DAYS;
    });
    if(!gone.length) return 0;
    return tx(['responses','drafts'],'readwrite',function(a){
      gone.forEach(function(r){ a.responses.delete(r.entryId); a.drafts.delete('entry:'+r.entryId); });
    }).then(function(){ return gone.length; });
  });
}

/* ---- questionnaire versioning ---- */
function snapshotKey(qid,v){ return qid+':'+v; }
function saveQuestionnaire(q, opts){
  opts=opts||{};
  var next=Object.assign({},q,{updatedAt:nowISO()});
  return tx(['questionnaires','versions'],'readwrite',function(a){
    if(opts.bumpVersion) next.version=(q.version||1)+1;
    a.questionnaires.put(next);
    a.versions.put({key:snapshotKey(next.id,next.version), questionnaireId:next.id, version:next.version,
                    title:next.title, questions:clone(next.questions||[]), savedAt:nowISO()});
    return next;
  });
}
function getSnapshot(qid,v){ return dbGet('versions',snapshotKey(qid,v)); }
function questionsSignature(qs){
  return JSON.stringify((qs||[]).map(function(q){
    return [q.id,q.type,q.label,(q.options||[]).join('\u001f'),q.required,q.min,q.max,q.order];
  }));
}

/* ============================ sync ============================ */
function postToScript(url, payload){
  return fetch(url,{
    method:'POST',
    // text/plain keeps it a "simple request" -> no CORS preflight, which Apps Script cannot answer
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify(payload),
    redirect:'follow'
  }).then(function(r){
    return r.text().then(function(t){
      var data=null; try{ data=JSON.parse(t); }catch(e){}
      if(!r.ok) throw new Error('HTTP '+r.status);
      if(data && data.ok===false) throw new Error(data.error||'Script reported an error');
      return data||{ok:true};
    });
  });
}
function buildSyncPayload(entry, qn, questions, interviewer){
  var answers={};
  questions=answerable(questions);
  questions.forEach(function(q){
    var v=entry.answers ? entry.answers[q.id] : undefined;
    if(Array.isArray(v)) v=v.join(', ');
    if(typeof v==='string' && v.slice(0,11)==='data:image/') v='[photo stored on device]';
    answers[q.id]=(v===undefined||v===null)?'':v;
  });
  return {
    action:'submit',
    interviewer:interviewer||'',
    questionnaire:{id:qn.id, title:qn.title||'Responses', version:entry.questionnaireVersion||qn.version||1},
    questions:questions.map(function(q){ return {id:q.id,label:q.label,order:q.order,type:q.type}; }),
    entry:{entryId:entry.entryId, createdAt:entry.createdAt, updatedAt:entry.updatedAt,
           deleted:!!entry.isDeleted, deletedAt:entry.deletedAt||'', answers:answers}
  };
}
function syncOne(entry, ctx){
  if(!ctx.sheetUrl) return Promise.reject(new Error('No Sheet link set'));
  var qn=ctx.qById[entry.questionnaireId];
  if(!qn) return Promise.reject(new Error('Questionnaire missing'));
  return getSnapshot(entry.questionnaireId, entry.questionnaireVersion).then(function(snap){
    var questions=(snap&&snap.questions)||qn.questions||[];
    return postToScript(ctx.sheetUrl, buildSyncPayload(entry,qn,questions,ctx.interviewer));
  }).then(function(){
    return updateResponse(entry.entryId,{syncStatus:'synced', syncedAt:nowISO(), syncError:null});
  }, function(err){
    return updateResponse(entry.entryId,{syncStatus:'failed', syncError:String(err.message||err)})
      .then(function(){ throw err; });
  });
}
function syncPending(onProgress){
  return Promise.all([getSettings(),dbAll('questionnaires'),dbAll('responses')]).then(function(r){
    var s=r[0], qs=r[1], all=r[2];
    if(!s.sheetUrl) throw new Error('Add your Google Sheet link in Functions first.');
    var qById={}; qs.forEach(function(q){ qById[q.id]=q; });
    var ctx={sheetUrl:s.sheetUrl, interviewer:s.interviewer, qById:qById};
    var pending=all.filter(function(e){ return e.syncStatus!=='synced'; })
                   .sort(function(a,b){ return a.entryId<b.entryId?-1:1; });
    var done=0, ok=0, fail=0;
    return pending.reduce(function(p,e){
      return p.then(function(){
        return syncOne(e,ctx).then(function(){ok++;},function(){fail++;}).then(function(){
          done++; if(onProgress) onProgress(done,pending.length);
        });
      });
    }, Promise.resolve()).then(function(){ return {total:pending.length, ok:ok, fail:fail}; });
  });
}

/* ============================ export ============================ */
function columnsFor(qn, responses){
  return dbAll('versions').then(function(vers){
    var cols=[], seen={};
    answerable(qn.questions).forEach(function(q){ if(!seen[q.id]){seen[q.id]=1; cols.push({id:q.id,label:q.label});} });
    var used={}; responses.forEach(function(r){ used[snapshotKey(r.questionnaireId,r.questionnaireVersion)]=1; });
    vers.filter(function(v){ return v.questionnaireId===qn.id && used[v.key]; })
        .sort(function(a,b){ return a.version-b.version; })
        .forEach(function(v){
          answerable(v.questions).forEach(function(q){
            if(!seen[q.id]){ seen[q.id]=1; cols.push({id:q.id,label:q.label+' (removed)'}); }
          });
        });
    return cols;
  });
}
function cellValue(v){
  if(v===undefined||v===null) return '';
  if(Array.isArray(v)) return v.join(', ');
  if(typeof v==='string' && v.slice(0,11)==='data:image/') return '[photo]';
  return v;
}
function buildRows(qn, responses, cols, interviewer){
  var header=['Timestamp','Entry ID','Interviewer','Sync status','Last updated','Form version']
    .concat(cols.map(function(c){ return c.label; }));
  var rows=responses.slice().sort(function(a,b){ return a.createdAt<b.createdAt?-1:1; }).map(function(r){
    var base=[fmtDT(r.createdAt), r.entryId, r.interviewer||interviewer||'', r.syncStatus, fmtDT(r.updatedAt), r.questionnaireVersion];
    return base.concat(cols.map(function(c){ return cellValue(r.answers?r.answers[c.id]:''); }));
  });
  return [header].concat(rows);
}
function exportXlsx(qn, responses, interviewer){
  return columnsFor(qn,responses).then(function(cols){
    var aoa=buildRows(qn,responses,cols,interviewer);
    var wb=XLSX.utils.book_new(), ws=XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols']=aoa[0].map(function(h){ return {wch:Math.min(42,Math.max(11,String(h).length+4))}; });
    var name=(qn.title||'Responses').replace(/[\\\/\?\*\[\]:]/g,' ').slice(0,31)||'Responses';
    XLSX.utils.book_append_sheet(wb,ws,name);
    XLSX.writeFile(wb, 'surveyscholar-'+slug(qn.title)+'-'+new Date().toISOString().slice(0,10)+'.xlsx');
  });
}
function exportCsv(qn, responses, interviewer){
  return columnsFor(qn,responses).then(function(cols){
    var aoa=buildRows(qn,responses,cols,interviewer);
    var csv=aoa.map(function(row){
      return row.map(function(c){
        c=String(c===undefined||c===null?'':c);
        return /[",\n]/.test(c) ? '"'+c.replace(/"/g,'""')+'"' : c;
      }).join(',');
    }).join('\r\n');
    download(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),
      'surveyscholar-'+slug(qn.title)+'-'+new Date().toISOString().slice(0,10)+'.csv');
  });
}
function slug(s){ return String(s||'form').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)||'form'; }

function backupAll(){
  return Promise.all(STORES.map(function(s){ return dbAll(s); })).then(function(res){
    var data={app:'surveyscholar', version:1, exportedAt:nowISO(), stores:{}};
    STORES.forEach(function(s,i){ data.stores[s]=res[i]; });
    download(new Blob([JSON.stringify(data)],{type:'application/json'}),
      'surveyscholar-backup-'+new Date().toISOString().slice(0,19).replace(/[:T]/g,'-')+'.json');
    return data;
  });
}
function restoreAll(data, mode){
  if(!data || data.app!=='surveyscholar' || !data.stores) throw new Error('Not a SurveyScholar backup file');
  return tx(STORES,'readwrite',function(a){
    STORES.forEach(function(s){
      if(mode==='replace') a[s].clear();
      (data.stores[s]||[]).forEach(function(rec){ a[s].put(rec); });
    });
  }).then(repairCounters);
}

/* ============================ questionnaire import ============================ */
var IMPORT_HEADERS=['Order','Question Type','Label','Options','Required','Image Filename',
  'Show If Question','Show If Condition','Show If Values'];
var HEADER_KEYS={order:'order', questiontype:'type', type:'type', label:'label', question:'label',
  questiontext:'label', options:'options', option:'options', required:'required', mandatory:'required',
  imagefilename:'image', image:'image', imagefile:'image',
  showifquestion:'condq', showif:'condq', condition:'condq', parent:'condq', parentquestion:'condq',
  showifcondition:'condop', conditiontype:'condop', showifoperator:'condop',
  showifvalues:'condvals', showifvalue:'condvals', conditionvalues:'condvals'};
var COND_WORDS={'':'any', 'is':'any', 'any':'any', 'isoneof':'any', 'equals':'any', 'in':'any',
  'isnot':'none', 'none':'none', 'isnotoneof':'none', 'notequals':'none', 'not':'none',
  'answered':'answered', 'hasanyanswer':'answered', 'any_answer':'answered', 'isanswered':'answered'};
function normHeader(h){ return String(h===undefined||h===null?'':h).trim().toLowerCase().replace(/[^a-z]/g,''); }
function mapColumns(headerRow){
  var map={};
  (headerRow||[]).forEach(function(h,i){
    var k=HEADER_KEYS[normHeader(h)];
    if(k && map[k]===undefined) map[k]=i;
  });
  return map;
}
function validTypeList(){ return TYPES.map(function(t){ return t[0]; }); }

/* Pure: takes an array of rows (row 0 = headers), returns questions + per-row problems. */
function validateImportRows(aoa){
  var errors=[], warnings=[], questions=[];
  if(!aoa || !aoa.length) return {errors:[{row:0,message:'The sheet is empty.'}], warnings:warnings, questions:questions};
  var map=mapColumns(aoa[0]);
  var missing=['type','label'].filter(function(k){ return map[k]===undefined; });
  if(missing.length) return {
    errors:[{row:1,message:'The header row must contain these columns: '+IMPORT_HEADERS.join(' | ')+'. Download the template and use it as-is.'}],
    warnings:[], questions:[]};
  var seenOrder={}, seenLabel={};
  for(var i=1;i<aoa.length;i++){
    var r=aoa[i]||[], rowNo=i+1;
    var cell=function(k){
      if(map[k]===undefined) return '';
      var v=r[map[k]];
      return String(v===undefined||v===null?'':v).trim();
    };
    if(!cell('order') && !cell('type') && !cell('label') && !cell('options') && !cell('required')) continue;
    var bad=false, label=cell('label'), rawType=cell('type');
    var q={id:uid(), label:label, required:false};

    if(!label){ errors.push({row:rowNo,message:'Label is empty — every question needs its text.'}); bad=true; }
    else if(seenLabel[label.toLowerCase()]) warnings.push({row:rowNo,message:'The same question text appears more than once.'});
    seenLabel[label.toLowerCase()]=1;

    var type=rawType.toLowerCase().replace(/[\s\-]+/g,'_');
    if(!rawType){ errors.push({row:rowNo,message:'Question Type is empty.'}); bad=true; }
    else if(validTypeList().indexOf(type)<0){
      errors.push({row:rowNo,message:'"'+rawType+'" is not a Question Type. Use one of: '+validTypeList().join(', ')}); bad=true;
    }
    q.type=type;

    var ord=cell('order');
    if(ord && !/^\d+$/.test(ord)){ errors.push({row:rowNo,message:'Order "'+ord+'" is not a whole number.'}); bad=true; }
    var order=ord?parseInt(ord,10):(questions.length+1);
    if(seenOrder[order]) warnings.push({row:rowNo,message:'Order '+order+' is used twice — the sheet order is kept instead.'});
    seenOrder[order]=1;
    q.order=order;

    var opts=cell('options');
    if(isChoice(type)){
      var list=opts.split(';').map(function(s){ return s.trim(); }).filter(Boolean);
      if(!list.length){ errors.push({row:rowNo,message:'A '+type+' question needs options, separated by semicolons.'}); bad=true; }
      else if(list.length===1) warnings.push({row:rowNo,message:'Only one option — check that this is intended.'});
      q.options=list;
    } else if(type==='linear_scale'){
      var parts=opts.split(';').map(function(s){ return s.trim(); }).filter(function(s){ return s!==''; });
      if(parts.length!==2 || !/^-?\d+$/.test(parts[0]) || !/^-?\d+$/.test(parts[1])){
        errors.push({row:rowNo,message:'A linear_scale needs Options written as minimum;maximum, for example 1;5.'}); bad=true;
      } else {
        var lo=parseInt(parts[0],10), hi=parseInt(parts[1],10);
        if(hi<=lo){ errors.push({row:rowNo,message:'The scale maximum must be larger than the minimum.'}); bad=true; }
        else if(hi-lo>20){ errors.push({row:rowNo,message:'That scale has more than 21 points — use a narrower range.'}); bad=true; }
        else { q.min=lo; q.max=hi; }
      }
    } else if(opts){
      warnings.push({row:rowNo,message:'Options are ignored for a '+(type||'this')+' question.'});
    }

    var rawReq=cell('required'), req=rawReq.toLowerCase();
    if(req==='' || ['n','no','false','0','optional'].indexOf(req)>=0) q.required=false;
    else if(['y','yes','true','1','required'].indexOf(req)>=0) q.required=true;
    else { errors.push({row:rowNo,message:'Required must be Y or N, not "'+rawReq+'".'}); bad=true; }

    var img=cell('image');
    if(img) q.imageFilename=img;

    if(isSection(type)){
      q.required=false;
      delete q.options; delete q.min; delete q.max; delete q.imageFilename;
      if(cell('required') && ['n','no','false','0',''].indexOf(req)<0)
        warnings.push({row:rowNo,message:'Required is ignored for a section heading.'});
    }

    var cq=cell('condq');
    if(cq){
      var rawOp=cell('condop'), opKey=rawOp.toLowerCase().replace(/[^a-z_]/g,'');
      var op=COND_WORDS[opKey];
      if(op===undefined){
        errors.push({row:rowNo,message:'Show If Condition "'+rawOp+'" is not understood. Use: is one of, is not one of, or answered.'});
        bad=true; op='any';
      }
      if(!/^\d+$/.test(cq)){
        errors.push({row:rowNo,message:'Show If Question must be the Order number of an earlier question, not "'+cq+'".'});
        bad=true;
      } else {
        q._cond={order:parseInt(cq,10), op:op,
          values:cell('condvals').split(';').map(function(x){ return x.trim(); }).filter(function(x){ return x!==''; }),
          row:rowNo};
      }
    } else if(cell('condop')||cell('condvals')){
      warnings.push({row:rowNo,message:'A Show If condition needs the Order number of the question it depends on — ignored.'});
    }
    q._origOrder=order;

    if(!bad) questions.push(q);
  }
  if(!errors.length && !questions.length) errors.push({row:0,message:'No question rows found under the header.'});
  questions.sort(function(a,b){ return a.order-b.order; });
  questions.forEach(function(q,i){ q.order=i; });

  /* second pass: resolve Show If references, now that every row has an identity */
  var byOrderNum={};
  questions.forEach(function(q){ if(byOrderNum[q._origOrder]===undefined) byOrderNum[q._origOrder]=q; });
  questions.forEach(function(q,i){
    var c=q._cond;
    delete q._cond; delete q._origOrder;
    if(!c) return;
    var parent=byOrderNum[c.order];
    if(!parent){ errors.push({row:c.row,message:'Show If Question '+c.order+' does not match any row.'}); return; }
    if(parent.id===q.id){ errors.push({row:c.row,message:'A question cannot depend on itself.'}); return; }
    if(questions.indexOf(parent)>=i){
      errors.push({row:c.row,message:'Show If Question '+c.order+' comes after this row. A condition may only point at an earlier question.'}); return;
    }
    if(isSection(parent.type)){
      errors.push({row:c.row,message:'Show If Question '+c.order+' is a section heading, which collects no answer.'}); return;
    }
    if(c.op!=='answered'){
      if(!c.values.length){
        errors.push({row:c.row,message:'Show If Values is empty — list the answers that reveal this row, separated by semicolons.'}); return;
      }
      if(isChoice(parent.type)){
        var bad2=c.values.filter(function(v){ return (parent.options||[]).map(String).indexOf(String(v))<0; });
        if(bad2.length){
          errors.push({row:c.row,message:'Show If Values '+bad2.map(function(v){return '"'+v+'"';}).join(', ')+' are not options of question '+c.order+' ('+(parent.options||[]).join('; ')+').'}); return;
        }
      } else if(parent.type==='linear_scale'){
        var out=c.values.filter(function(v){ return !/^-?\d+$/.test(v) || Number(v)<parent.min || Number(v)>parent.max; });
        if(out.length){
          errors.push({row:c.row,message:'Show If Values must be numbers between '+parent.min+' and '+parent.max+' for question '+c.order+'.'}); return;
        }
      }
    }
    q.showIf={q:parent.id, op:c.op, values:c.op==='answered'?[]:c.values};
  });
  return {errors:errors, warnings:warnings, questions:questions};
}

function readWorkbookRows(file){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onerror=function(){ rej(new Error('That file could not be read.')); };
    fr.onload=function(){
      try{
        var wb=XLSX.read(new Uint8Array(fr.result),{type:'array'});
        var first=wb.SheetNames[0];
        if(!first) throw new Error('The workbook has no sheets.');
        res(XLSX.utils.sheet_to_json(wb.Sheets[first],{header:1, raw:false, defval:''}));
      }catch(e){ rej(new Error('That is not a readable .xlsx or .csv file.')); }
    };
    fr.readAsArrayBuffer(file);
  });
}

/* ---- document import (heuristic, always reviewed by a human) ---- */
function loadScript(src){
  return new Promise(function(res,rej){
    if(document.querySelector('script[data-src="'+src+'"]')){
      var wait=setInterval(function(){ if(window.__loaded_[src]){ clearInterval(wait); res(); } },60);
      setTimeout(function(){ clearInterval(wait); res(); },12000);
      return;
    }
    var s=document.createElement('script');
    s.src=src; s.setAttribute('data-src',src); s.crossOrigin='anonymous';
    s.onload=function(){ window.__loaded_[src]=1; res(); };
    s.onerror=function(){ rej(new Error('Could not load the reader for that file type — you need to be online the first time.')); };
    document.head.appendChild(s);
  });
}

function fileBuffer(file){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onerror=function(){ rej(new Error('That file could not be read.')); };
    fr.onload=function(){ res(fr.result); };
    fr.readAsArrayBuffer(file);
  });
}
function extractDocx(file){
  return loadScript(MAMMOTH_URL).then(function(){ return fileBuffer(file); }).then(function(buf){
    return window.mammoth.extractRawText({arrayBuffer:buf}).then(function(r){ return r.value||''; });

function extractPdf(file){
  return loadScript(PDFJS_URL).then(function(){ return fileBuffer(file); }).then(function(buf){
    var lib=window.pdfjsLib;
    lib.GlobalWorkerOptions.workerSrc=PDFJS_WORKER;
    return lib.getDocument({data:buf}).promise.then(function(doc){
      var pages=[];
      for(var i=1;i<=doc.numPages;i++) pages.push(i);
      return pages.reduce(function(p,n){
        return p.then(function(acc){
          return doc.getPage(n).then(function(pg){ return pg.getTextContent(); }).then(function(tc){
            var lastY=null, line='', out=[];
            tc.items.forEach(function(it){
              var y=it.transform[5];
              if(lastY!==null && Math.abs(y-lastY)>3){ out.push(line); line=''; }
              line+=it.str;
              lastY=y;
            });
            out.push(line);
            return acc+out.join('\n')+'\n';
          });
        });
      }, Promise.resolve(''));
    });
  });
}

/* Pure: raw text -> draft questions, each flagged when the guess is not confident. */
function parseDocumentText(text){
  var lines=String(text===undefined||text===null?'':text).split(/\r?\n/);
  var qs=[], cur=null;
  var Q=/^\s*(?:Q\s*)?(\d+)\s*[\.\)\:]\s*(.+)$/i;
  var OPT=/^\s*(?:\(?([a-zA-Z])[\.\)]|[ivx]+\)|[\u25A1\u2610\u25CB\u25EF]|\[\s*\])\s*(.+)$/;
  var BUL=/^\s*[\u2022\u00B7\*\-\u2013]\s+(.+)$/;
  var HEAD=/^\s*(?:(?:section|part|module|block)\s*[-:.]?\s*[A-Z0-9]*\s*[-:.]?\s*)(.*)$/i;
  function push(){ if(cur && String(cur.label).trim()) qs.push(cur); cur=null; }
  function isHeading(line){
    if(HEAD.test(line)) return true;
    // a short ALL-CAPS line with no question mark reads as a heading
    return line.length<=60 && !/[?_]/.test(line) && /[A-Z]/.test(line)
      && line===line.toUpperCase() && /^[A-Z0-9 ,&'\-:().]+$/.test(line) && line.split(' ').length<=8;
  }
  lines.forEach(function(raw){
    var line=String(raw).trim();
    if(!line) return;
    if(!/^\s*(?:Q\s*)?\d+\s*[\.\)\:]/.test(line) && isHeading(line)){
      push();
      var hm=line.match(HEAD);
      qs.push({id:uid(), type:'section', label:((hm&&hm[1]&&hm[1].trim())||line).replace(/[:.]+$/,'').trim()||line, _section:true});
      return;
    }
    var m=line.match(Q);
    if(m){ push(); cur={id:uid(), label:m[2].trim(), options:[]}; return; }
    if(cur){
      var o=line.match(OPT);
      if(o && o[2] && o[2].trim().length<=120){ cur.options.push(o[2].trim()); return; }
      var b=line.match(BUL);
      if(b && b[1].trim().length<=120){ cur.options.push(b[1].trim()); return; }
      if(cur.options.length===0 && cur.label.length<200){ cur.label+=' '+line; return; }
      return;
    }
    var b2=line.match(BUL);
    if(b2){ push(); cur={id:uid(), label:b2[1].trim(), options:[]}; return; }
    if(/[?:]\s*$/.test(line)||/_{3,}/.test(line)){ push(); cur={id:uid(), label:line, options:[]}; }
  });
  push();

  /* "If yes, ..." style sub-questions attach to the nearest earlier choice question */
  qs.forEach(function(q,i){
    if(q._section) return;
    var m=String(q.label).match(/^\s*\(?\s*if\s+(?:the\s+)?(?:answer\s+(?:is|was)\s+)?["']?([A-Za-z][A-Za-z \-]{0,24}?)["']?\s*[,:\)]\s*(.+)$/i);
    if(!m) return;
    var want=m[1].trim(), rest=m[2].trim();
    for(var j=i-1;j>=0;j--){
      var prev=qs[j];
      if(prev._section) continue;
      if(!isChoiceGuess(prev)) continue;
      var opt=(prev.options||[]).filter(function(o){ return String(o).toLowerCase()===want.toLowerCase(); })[0];
      if(opt){ q._condFrom={id:prev.id, value:opt}; q.label=rest; }
      break;
    }
  });
  qs.forEach(function(q,i){
    if(q._section){ q.order=i; q.required=false; delete q.options; return; }
    var L=q.label.toLowerCase(), uncertain=false;
    var scale=L.match(/(?:scale\s*(?:of|from)?\s*|rate[^0-9]{0,12}|\()(-?\d+)\s*(?:to|through|-|\u2013)\s*(-?\d+)\)?/);
    if(/select all that apply|check all|tick all|multiple answers|more than one/.test(L)) q.type='checkbox';
    else if(/select one|choose one|tick one|single answer|only one/.test(L)) q.type='multiple_choice';
    else if(scale && Math.abs(+scale[2]-+scale[1])<=20 && +scale[2]>+scale[1]){
      q.type='linear_scale'; q.min=+scale[1]; q.max=+scale[2];
    }
    else if(/date of|what date|dd\/mm|day\/month|when did|when was/.test(L)) q.type='date';
    else if(/how many|number of|how old|\bage\b|quantity|amount|how much/.test(L)) q.type='number';
    else if(/photo|picture|image of|upload/.test(L)) q.type='image_upload';
    else if(q.options.length>=2){ q.type='multiple_choice'; uncertain=true; }
    else if(/describe|explain|comment|elaborate|in your own words|why do/.test(L)) q.type='long_text';
    else if(/_{3,}/.test(q.label)) q.type='short_text';
    else { q.type='short_text'; uncertain=true; }

    if(isChoice(q.type) && q.options.length<1){ q.type='short_text'; uncertain=true; }
    q.required=!/optional|if any|if applicable/.test(L);
    q.label=q.label
      .replace(/\((?:please\s*)?(?:select|tick|choose)[^)]*\)/ig,'')
      .replace(/_{3,}/g,' ')
      .replace(/\s{2,}/g,' ').trim();
    if(!q.label) { q.label='Untitled question'; uncertain=true; }
    if(!isChoice(q.type)) delete q.options;
    q.order=i;
    if(q._condFrom){ q.showIf={q:q._condFrom.id, op:'any', values:[String(q._condFrom.value)]}; delete q._condFrom; }
    q._uncertain=uncertain;
  });
  var fixed=sanitizeConditions(qs.map(function(q){ var c=Object.assign({},q); delete c._section; return c; }));
  return {questions:fixed.questions,
          uncertain:fixed.questions.filter(function(q){ return q._uncertain; }).length,
          sections:fixed.questions.filter(function(q){ return isSection(q.type); }).length,
          conditional:fixed.questions.filter(function(q){ return q.showIf&&q.showIf.q; }).length};
}
function applyImages(questions, images){
  return questions.map(function(q){
    var c=Object.assign({},q);
    var k=c.imageFilename?String(c.imageFilename).trim().toLowerCase():'';
    if(k && images[k]) c.imageUrl=images[k];
    return c;
  });
}

function isChoiceGuess(q){ return (q.options||[]).length>=1; }
function stripDraftFlags(questions){
  return questions.map(function(q){
    var c=Object.assign({},q);
    delete c._uncertain; delete c.imageFilename;
    return c;
  });
}
function uniqueTitle(base, existing){
  var names={}; (existing||[]).forEach(function(q){ names[String(q.title||'').trim().toLowerCase()]=1; });
  var t=String(base||'Imported questionnaire').trim()||'Imported questionnaire';
  if(!names[t.toLowerCase()]) return t;
  var n=2;
  while(names[(t+' ('+n+')').toLowerCase()]) n++;
  return t+' ('+n+')';
}

/* ============================ image helper ============================ */
function readImage(file, max, quality){
  max=max||1280; quality=quality||0.72;
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onerror=function(){ rej(new Error('Could not read that file')); };
    fr.onload=function(){
      var img=new Image();
      img.onerror=function(){ rej(new Error('That file is not an image')); };
      img.onload=function(){
        var w=img.width,h=img.height,sc=Math.min(1,max/Math.max(w,h));
        var c=document.createElement('canvas'); c.width=Math.round(w*sc); c.height=Math.round(h*sc);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        res(c.toDataURL('image/jpeg',quality));
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}

  else if(q.type==='long_text') body=html`<textarea value=${v||''} onChange=${function(e){set(e.target.value);}}></textarea>`;
  else if(q.type==='number') body=html`<input type="number" inputMode="decimal" value=${v===undefined||v===null?'':v}
      min=${q.min} max=${q.max} onChange=${function(e){set(e.target.value===''?'':Number(e.target.value));}}/>`;
  else if(q.type==='date') body=html`<input type="date" value=${v||''} onChange=${function(e){set(e.target.value);}}/>`;
  else if(q.type==='dropdown') body=html`<select value=${v||''} onChange=${function(e){set(e.target.value);}}>
      <option value="">Choose…</option>
      ${(q.options||[]).map(function(o,i){ return html`<option key=${i} value=${o}>${o}</option>`; })}
    </select>`;
  else if(q.type==='multiple_choice') body=html`<div className="opts">
      ${(q.options||[]).map(function(o,i){ return html`<label key=${i} className=${'opt'+(v===o?' on':'')}>
        <input type="radio" name=${'q'+q.id} checked=${v===o} onChange=${function(){set(o);}}/><span>${o}</span></label>`; })}
      ${v && !q.required ? html`<button className="btn-ghost btn" onClick=${function(){set(undefined);}}>Clear answer</button>` : null}
    </div>`;
  else if(q.type==='checkbox'){

          <input type="checkbox" checked=${on} onChange=${function(){
            set(on?arr.filter(function(x){return x!==o;}):arr.concat([o]));
          }}/><span>${o}</span></label>`;
      })}

  }

    var items=[]; for(var i=lo;i<=hi && items.length<21;i++) items.push(i);

      <div className="scale">${items.map(function(n){

      })}</div>
      ${(q.minLabel||q.maxLabel)?html`<div className="row-between tiny muted" style=${{marginTop:'6px'}}>
        <span>${q.minLabel||''}</span><span>${q.maxLabel||''}</span></div>`:null}
    </div>`;

      <div className="row">
        <label className="btn btn-sm" style=${{flex:1}}>
          ${v?'Replace photo':'Take or choose photo'}
          <input type="file" accept="image/*" capture="environment" style=${{display:'none'}}
            onChange=${function(e){ var f=e.target.files&&e.target.files[0]; if(!f) return;

        </label>

    ${q.help?html`<p className="small muted" style=${{margin:'-3px 0 8px'}}>${q.help}</p>`:null}
    ${body}
    ${err?html`<p className="err">${err}</p>`:null}
  </div>`;
}

function validate(questions, answers){
  var errs={};
  visibleQuestions(questions,answers).forEach(function(q){
    if(!q.required) return;
    var v=answers[q.id];
    var empty = v===undefined||v===null||v===''||(Array.isArray(v)&&v.length===0);
    if(empty) errs[q.id]='This answer is required.';
  });
  return errs;
}
function isDraftDirty(answers){
  if(!answers) return false;
  return Object.keys(answers).some(function(k){
    var v=answers[k];
    return !(v===undefined||v===null||v===''||(Array.isArray(v)&&v.length===0));
  });
}

function EntryForm(p){
  // p: questionnaire, entry (or null for new), interviewer, onClose, onSaved
  var s1=useState(null), questions=s1[0], setQuestions=s1[1];
  var s2=useState({}), answers=s2[0], setAnswers=s2[1];
  var s3=useState({}), errors=s3[0], setErrors=s3[1];
  var s4=useState(false), saving=s4[0], setSaving=s4[1];
  var s5=useState(false), recovered=s5[0], setRecovered=s5[1];
  var s6=useState(true), loading=s6[0], setLoading=s6[1];
  var draftId = p.entry ? 'entry:'+p.entry.entryId : 'new:'+p.questionnaire.id;
  var timer=useRef(null), mounted=useRef(false);

      ? getSnapshot(p.entry.questionnaireId, p.entry.questionnaireVersion).then(function(sn){
          return (sn&&sn.questions&&sn.questions.length)?sn.questions:(p.questionnaire.questions||[]);
        })
