      setTimeout(function(){ mounted.current=true; },0);
    });
  },[]);

  // debounced draft autosave (500ms) on every change
  useEffect(function(){
    if(!mounted.current) return;
    if(timer.current) clearTimeout(timer.current);
    timer.current=setTimeout(function(){
      dbPut('drafts',{id:draftId, questionnaireId:p.questionnaire.id, entryId:p.entry?p.entry.entryId:null,
                      answers:answers, updatedAt:nowISO()});
    },500);
    return function(){ if(timer.current) clearTimeout(timer.current); };
  },[answers]);

  function setAns(qid,val){
    setAnswers(function(prev){
      var n=Object.assign({},prev);
      if(val===undefined) delete n[qid]; else n[qid]=val;
      return n;
    });
    setErrors(function(prev){ if(!prev[qid]) return prev; var n=Object.assign({},prev); delete n[qid]; return n; });
  }
  function discardDraft(){
    UI.confirm({title:'Discard recovered draft?',message:'The answers recovered from your last session will be cleared.',danger:true,okText:'Discard'})
      .then(function(yes){ if(!yes) return;
        setAnswers(p.entry?clone(p.entry.answers||{}):{}); setRecovered(false); });
  }
  function close(){
    if(!p.entry && isDraftDirty(answers)){
      UI.confirm({title:'Leave this entry?',message:'Your answers are saved as a draft and will be waiting here when you come back.',okText:'Leave'})
        .then(function(yes){ if(yes) p.onClose(); });
    } else p.onClose();
  }
  function submit(){
    var errs=validate(questions,answers);
    setErrors(errs);
    var keys=Object.keys(errs);
    if(keys.length){
      UI.toast(keys.length+' required '+(keys.length===1?'answer is':'answers are')+' missing');
      var el=document.getElementById('f-'+keys[0]);
      if(el) el.scrollIntoView({behavior:'smooth',block:'center'});
      return;
    }
    setSaving(true);
    var t=nowISO();
    var kept=clone(pruneHiddenAnswers(questions,answers));
    var work;
    if(p.entry){
      work=updateResponse(p.entry.entryId,{answers:kept, updatedAt:t, syncStatus:'local', syncError:null})
        .then(function(){ return p.entry.entryId; });
    }else{
      work=createResponse({
        questionnaireId:p.questionnaire.id, questionnaireVersion:p.questionnaire.version||1,
        answers:kept, createdAt:t, updatedAt:t, syncStatus:'local', syncedAt:null,
        interviewer:p.interviewer||''
      });
    }
    work.then(function(entryId){
      return dbDel('drafts',draftId).then(function(){ return entryId; });
    }).then(function(entryId){
      UI.toast((p.entry?'Entry updated · ':'Entry saved · ')+entryId);
      p.onSaved(entryId);
      setSaving(false);
    }).catch(function(e){
      setSaving(false);
      UI.confirm({title:'Not saved',message:'Nothing was written. '+(e.message||e),okText:'OK',cancelText:'Close'});
    });
  }

  var shown = questions?visibleElements(questions,answers):[];
  var hiddenCount = questions?(answerable(questions).length-answerable(shown).length):0;
  var oldVersion = p.entry && p.entry.questionnaireVersion !== p.questionnaire.version;
  return html`<${Sheet} title=${p.entry?('Edit '+p.entry.entryId):'New entry'} onClose=${close}
    foot=${html`<${React.Fragment}>
      <button className="btn" style=${{flex:'0 0 auto'}} onClick=${close}>Cancel</button>
      <button className="btn btn-primary btn-block" disabled=${saving||loading} onClick=${submit}>
        ${saving?'Saving…':(p.entry?'Save changes':'Save entry')}</button>
    <//>`}>
    ${loading ? html`<p className="muted" style=${{padding:'20px 0'}}>Loading form…</p>` : html`<${React.Fragment}>
      <div className="stack" style=${{paddingTop:'14px'}}>
        ${recovered?html`<div className="banner warn row-between">
          <span>Draft recovered from your last session.</span>
          <button className="btn btn-sm" onClick=${discardDraft}>Discard</button>
        </div>`:null}
        ${oldVersion?html`<div className="banner info">This entry was collected on form version ${p.entry.questionnaireVersion}. It is shown with the questions as they were then, so the answers stay readable.</div>`:null}
        ${questions.length===0?html`<div className="empty">This questionnaire has no questions yet. Add some in the Questionnaire tab.</div>`:null}
        ${shown.map(function(q){
          return html`<${Field} key=${q.id} q=${q} value=${answers[q.id]} error=${errors[q.id]}
            conditional=${!!(q.showIf&&q.showIf.q)} onChange=${function(v){ setAns(q.id,v); }}/>`;
        })}
        ${hiddenCount>0?html`<p className="tiny muted">${hiddenCount} further ${hiddenCount===1?'question depends':'questions depend'} on answers above and will appear when they apply.</p>`:null}
        ${p.entry?html`<${React.Fragment}>
          <p className="tiny muted">Entry ${p.entry.entryId} · created ${fmtDT(p.entry.createdAt)} · saving keeps the same ID.</p>
          <button className="btn btn-danger btn-block" onClick=${function(){
            confirmDeleteEntry(p.entry).then(function(done){ if(done) p.onDeleted(); });
          }}>Delete this entry</button>
        <//>`:null}
      </div>
    <//>`}
  <//>`;
}

/* ============================ All entries (full screen) ============================ */
function AllEntries(p){
  var s1=useState(''), q=s1[0], setQ=s1[1];
  var s2=useState('all'), filt=s2[0], setFilt=s2[1];
  var s3=useState(30), limit=s3[0], setLimit=s3[1];
  var deletedList=useMemo(function(){
    return p.responses.filter(function(r){ return r.isDeleted; });
  },[p.responses]);
  var list=useMemo(function(){
    var t=q.trim().toLowerCase();
    var base = filt==='deleted' ? deletedList : liveOnly(p.responses);
    return base.filter(function(r){
      if(filt!=='all' && filt!=='deleted' && r.syncStatus!==filt) return false;
      if(!t) return true;
      if(r.entryId.indexOf(t)>=0) return true;
      if(fmtDT(r.createdAt).toLowerCase().indexOf(t)>=0) return true;
      return Object.keys(r.answers||{}).some(function(k){
        var v=r.answers[k];
        if(Array.isArray(v)) v=v.join(' ');
        return typeof v==='string' && v.toLowerCase().indexOf(t)>=0;
      });
    }).sort(function(a,b){ return a.createdAt<b.createdAt?1:-1; });
  },[p.responses,q,filt,deletedList]);
  var liveCount=liveOnly(p.responses).length;
  return html`<${Sheet} title=${'All entries · '+p.questionnaire.title} onClose=${p.onClose}>
    <div className="stack" style=${{paddingTop:'14px'}}>
      <input type="text" placeholder="Search by ID, date or answer" value=${q}
        onChange=${function(e){ setQ(e.target.value); setLimit(30); }}/>
      <div className="chips">
        ${[['all','All'],['local','On device'],['synced','Synced'],['failed','Sync failed'],
           ['deleted','Recently deleted ('+deletedList.length+')']].map(function(f){
          return html`<button key=${f[0]} className=${'chip'+(filt===f[0]?' on':'')}
            onClick=${function(){ setFilt(f[0]); setLimit(30); }}>${f[1]}</button>`;
        })}
      </div>
      ${filt==='deleted'?html`<div className="banner warn">
        Deleted entries are kept for ${PURGE_DAYS} days, then removed for good once the deletion has reached the sheet. Their entry IDs are never reused.
      </div>`:null}
      <p className="small muted num">${list.length} of ${filt==='deleted'?deletedList.length:liveCount} entries</p>
      <div className="card">
        ${list.length===0?html`<div className="empty">${filt==='deleted'?'Nothing has been deleted.':'Nothing matches that filter.'}</div>`:
          list.slice(0,limit).map(function(r){
            return html`<div className="entry" key=${r.entryId}>
              <div style=${{minWidth:0}}>
                <div className="eid mono">${r.entryId}</div>
                <div className="tiny muted">${fmtDT(r.createdAt)}${r.updatedAt!==r.createdAt&&!r.isDeleted?' · edited':''}
                  ${r.isDeleted?' · deleted '+fmtDT(r.deletedAt):''}</div>
                ${r.syncStatus==='failed'&&r.syncError?html`<div className="tiny" style=${{color:'var(--fail)'}}>${r.syncError}</div>`:null}
              </div>
              <div className="row">
                <${Badge} status=${r.syncStatus}/>
                ${r.isDeleted
                  ? html`<button className="btn btn-sm" onClick=${function(){
                      confirmRestoreEntry(r).then(function(done){ if(done) p.refresh(); }); }}>Restore</button>`
                  : html`<${React.Fragment}>
                      <button className="btn btn-sm" onClick=${function(){ p.onEdit(r); }}>Edit</button>
                      <button className="btn btn-sm btn-danger" onClick=${function(){
                        confirmDeleteEntry(r).then(function(done){ if(done) p.refresh(); }); }}>Delete</button>
                    <//>`}
              </div>
            </div>`;
          })}
      </div>
      ${list.length>limit?html`<button className="btn btn-block" onClick=${function(){setLimit(limit+30);}}>Show 30 more</button>`:null}
    </div>
  <//>`;
}

/* ============================ Input page ============================ */
function InputPage(p){
  var s1=useState(null), sheet=s1[0], setSheet=s1[1]; // {mode:'new'|'edit'|'all', entry}
  var s2=useState(null), draft=s2[0], setDraft=s2[1];
  var qn=p.active;
  var recent=useMemo(function(){
    return p.responses.slice().sort(function(a,b){ return a.createdAt<b.createdAt?1:-1; }).slice(0,10);
  },[p.responses]);

  useEffect(function(){
    if(!qn) { setDraft(null); return; }
    dbGet('drafts','new:'+qn.id).then(function(d){ setDraft(d&&isDraftDirty(d.answers)?d:null); });
  },[qn&&qn.id, sheet]);

  function switchQuestionnaire(id){
    if(!id || (qn&&id===qn.id)) return;
    var go=function(){ p.onSetActive(id); };
    if(draft){
      UI.confirm({title:'You have an unsaved draft',
        message:'An unfinished entry for “'+qn.title+'” is saved on this device. Switching keeps it — you can come back and finish it. Nothing is sent to the sheet until you save the entry.',
        okText:'Switch form'}).then(function(yes){ if(yes) go(); });
    } else go();
  }

  if(!p.questionnaires.length) return html`<div className="wrap">
    <div className="card" style=${{marginTop:'16px'}}>
      <h2>Start with a questionnaire</h2>
      <p className="muted small" style=${{marginTop:'6px'}}>Build your questions first, then come back here to collect answers in the field.</p>
      <button className="btn btn-primary btn-block" style=${{marginTop:'14px'}}
        onClick=${function(){ location.hash='#/questionnaire'; }}>Go to Questionnaire</button>
    </div>
  </div>`;

  return html`<div className="wrap">
    <div className="stack" style=${{paddingTop:'14px'}}>
      <div className="card">
        <span className="lbl">Collecting for</span>
        <select value=${qn?qn.id:''} onChange=${function(e){ switchQuestionnaire(e.target.value); }}>
          ${p.questionnaires.map(function(x){ return html`<option key=${x.id} value=${x.id}>${x.title}</option>`; })}
        </select>
        ${qn?html`<p className="tiny muted num" style=${{marginTop:'8px'}}>
          Form version ${qn.version} · ${(qn.questions||[]).length} questions · ${p.responses.length} collected${qn.targetCount?(' of '+qn.targetCount):''}
        </p>`:null}
      </div>

      ${draft?html`<div className="banner warn row-between">
        <span>Unfinished entry saved on this device.</span>
        <button className="btn btn-sm" onClick=${function(){ setSheet({mode:'new',nonce:uid()}); }}>Continue</button>
      </div>`:null}

      ${qn && (qn.questions||[]).length===0 ? html`<div className="banner info">
        This form has no questions yet. Add them in the Questionnaire tab before collecting.
      </div>`:null}

      <div className="card">
        <div className="row-between" style=${{marginBottom:'6px'}}>
          <h2>Recent entries</h2>
          ${p.allResponses.length>0?html`<button className="btn-ghost btn btn-sm" onClick=${function(){ setSheet({mode:'all'}); }}>
            Show all (${p.responses.length})</button>`:null}
        </div>
        ${recent.length===0?html`<div className="empty">No entries yet. Tap <b>New entry</b> to record your first one.</div>`:
          recent.map(function(r){
            return html`<div className="entry" key=${r.entryId}>
              <div style=${{minWidth:0}}>
                <div className="eid mono">${r.entryId}</div>
                <div className="tiny muted">${fmtDT(r.createdAt)}${r.updatedAt!==r.createdAt?' · edited':''}</div>
              </div>
              <div className="row">
                <${Badge} status=${r.syncStatus}/>
                <button className="btn btn-sm" onClick=${function(){ setSheet({mode:'edit',entry:r}); }}>Edit</button>
                <button className="btn btn-sm btn-danger" onClick=${function(){
                  confirmDeleteEntry(r).then(function(done){ if(done) { p.refresh(); p.trySync(); } });
                }}>Delete</button>
              </div>
            </div>`;
          })}
      </div>
    </div>

    ${qn?html`<button className="fab" onClick=${function(){ setSheet({mode:'new',nonce:uid()}); }}>
      <${Icon} n="plus"/> New entry</button>`:null}

    ${sheet&&sheet.mode==='all'?html`<${AllEntries} questionnaire=${qn} responses=${p.allResponses}
      onClose=${function(){ setSheet(null); }}
      refresh=${function(){ p.refresh(); p.trySync(); }}
      onEdit=${function(r){ setSheet({mode:'edit',entry:r}); }}/>`:null}

    ${sheet&&(sheet.mode==='new'||sheet.mode==='edit')?html`<${EntryForm}
      key=${sheet.mode+'-'+(sheet.entry?sheet.entry.entryId:sheet.nonce)}
      questionnaire=${qn} entry=${sheet.mode==='edit'?sheet.entry:null} interviewer=${p.settings.interviewer}
      onClose=${function(){ setSheet(null); }}
      onDeleted=${function(){ setSheet(null); p.refresh(); p.trySync(); }}
      onSaved=${function(){ setSheet(null); p.refresh(); p.trySync(); }}/>`:null}
  </div>`;
}

/* ============================ Overview page ============================ */
function OverviewPage(p){
  var s1=useState(p.settings.activeQuestionnaireId||'all'), pick=s1[0], setPick=s1[1];
  var s2=useState(false), busy=s2[0], setBusy=s2[1];
  var qById={}; p.questionnaires.forEach(function(q){ qById[q.id]=q; });
  var scoped=useMemo(function(){
    return pick==='all'?p.allResponses:p.allResponses.filter(function(r){ return r.questionnaireId===pick; });
  },[p.allResponses,pick]);
  var rows=useMemo(function(){ return liveOnly(scoped); },[scoped]);
  var target = pick==='all'
    ? p.questionnaires.reduce(function(a,q){ return a+(Number(q.targetCount)||0); },0)
    : (Number((qById[pick]||{}).targetCount)||0);
  var pct = target>0 ? Math.min(100, Math.round(rows.length/target*100)) : 0;
  var counts={local:0,synced:0,failed:0};
  rows.forEach(function(r){ counts[r.syncStatus]=(counts[r.syncStatus]||0)+1; });
  var pendingDeletes=scoped.filter(function(r){ return r.isDeleted && r.syncStatus!=='synced'; }).length;
  var today=new Date().toDateString();
  var todayCount=rows.filter(function(r){ return new Date(r.createdAt).toDateString()===today; }).length;

  function runExport(kind){
    if(pick==='all'){ UI.toast('Choose one questionnaire to export'); return; }
    var qn=qById[pick];
    if(!rows.length){ UI.toast('Nothing to export yet'); return; }
    setBusy(true);
    var f = kind==='csv'?exportCsv:exportXlsx;
    f(qn,rows,p.settings.interviewer).then(function(){ setBusy(false); UI.toast('File downloaded'); },
      function(e){ setBusy(false); UI.toast('Export failed: '+(e.message||e)); });
  }

  return html`<div className="wrap"><div className="stack" style=${{paddingTop:'14px'}}>
    <div className="card">
      <span className="lbl">Showing</span>
      <select value=${pick} onChange=${function(e){ setPick(e.target.value); }}>
        <option value="all">All questionnaires</option>
        ${p.questionnaires.map(function(x){ return html`<option key=${x.id} value=${x.id}>${x.title}</option>`; })}
      </select>
    </div>

    <div className="hero">
      <div className="big num">${rows.length}</div>
      <p style=${{marginTop:'4px'}}>responses collected</p>
      <p className="small muted num" style=${{marginTop:'2px'}}>${todayCount} today</p>
      ${target>0?html`<${React.Fragment}>
        <div className="bar"><i style=${{width:pct+'%'}}></i></div>
        <div className="row-between small num" style=${{marginTop:'8px'}}>
          <span className="muted">Target ${target}</span>
          <span style=${{fontWeight:600}}>${pct}% achieved · ${Math.max(0,target-rows.length)} to go</span>
        </div>
      <//>`:html`<p className="small muted" style=${{marginTop:'10px'}}>Set a target in the Questionnaire tab to track progress.</p>`}
    </div>

    <div className="card">
      <h2>Sync status</h2>
      <div className="row" style=${{marginTop:'10px',flexWrap:'wrap',gap:'8px'}}>
        <span className="badge synced"><i className="dot"></i>${counts.synced} synced</span>
        <span className="badge local"><i className="dot"></i>${counts.local} on device</span>
        <span className="badge failed"><i className="dot"></i>${counts.failed} failed</span>
      </div>
      ${pendingDeletes>0?html`<p className="small muted" style=${{marginTop:'10px'}}>
        ${pendingDeletes} ${pendingDeletes===1?'deletion has':'deletions have'} not reached the sheet yet — they sync with everything else.</p>`:null}
      ${(counts.local+counts.failed+pendingDeletes)>0?html`<button className="btn btn-block" style=${{marginTop:'12px'}}
        onClick=${p.onSyncNow}>Sync now</button>`:null}
    </div>

    <div className="card">
      <h2>Export</h2>
      <p className="small muted" style=${{marginTop:'6px'}}>
        One row per response, one column per question, plus entry ID, timestamp and sync status.
        ${pick==='all'?' Pick a single questionnaire to export.':''}
      </p>
      <div className="row" style=${{marginTop:'12px'}}>
        <button className="btn btn-primary" style=${{flex:1}} disabled=${busy||pick==='all'} onClick=${function(){runExport('xlsx');}}>
          Export to Excel</button>
        <button className="btn" disabled=${busy||pick==='all'} onClick=${function(){runExport('csv');}}>CSV</button>
      </div>
    </div>
  </div></div>`;
}

/* ============================ Question editor ============================ */
function QuestionEditor(p){
  var s1=useState(clone(p.question)), q=s1[0], setQ=s1[1];
  var sect=isSection(q.type);
  var cond=q.showIf||{};
  var parents=answerable(p.available||[]).filter(function(x){ return x.id!==q.id; });
  var parent=parents.filter(function(x){ return x.id===cond.q; })[0];
  var parentChoices=parent?(isChoice(parent.type)?(parent.options||[]):
    (parent.type==='linear_scale'?(function(){ var a=[],lo=Number(parent.min||1),hi=Number(parent.max||5);
      for(var i=lo;i<=hi&&a.length<21;i++) a.push(i); return a; })():[])):[];
  function up(patch){ setQ(function(prev){ return Object.assign({},prev,patch); }); }
  function setOpt(i,val){ var o=(q.options||[]).slice(); o[i]=val; up({options:o}); }
  function addOpt(){ up({options:(q.options||[]).concat(['Option '+((q.options||[]).length+1)])}); }
  function delOpt(i){ var o=(q.options||[]).slice(); o.splice(i,1); up({options:o}); }
  function moveOpt(i,d){ var o=(q.options||[]).slice(); var j=i+d; if(j<0||j>=o.length) return;
    var t=o[i]; o[i]=o[j]; o[j]=t; up({options:o}); }
  function save(){
    if(!String(q.label||'').trim()){ UI.toast(sect?'Give the section a heading':'Give the question a label'); return; }
    if(!sect && isChoice(q.type) && (q.options||[]).filter(function(o){return String(o).trim();}).length<1){
      UI.toast('Add at least one option'); return; }
    if(q.showIf && q.showIf.q && q.showIf.op!=='answered' && !(q.showIf.values||[]).length){
      UI.toast('Choose at least one answer that reveals this'); return; }
    var clean=Object.assign({},q,{label:String(q.label).trim()});
    if(sect){ delete clean.options; delete clean.min; delete clean.max;
      delete clean.minLabel; delete clean.maxLabel; delete clean.imageUrl; delete clean.help; clean.required=false; }
    if(isChoice(clean.type)) clean.options=(clean.options||[]).map(function(o){return String(o).trim();}).filter(Boolean);
    else delete clean.options;
    if(clean.type==='linear_scale'){
      clean.min=Number(clean.min===undefined||clean.min===''?1:clean.min);
      clean.max=Number(clean.max===undefined||clean.max===''?5:clean.max);
      if(clean.max<=clean.min) clean.max=clean.min+1;
    }
    p.onSave(clean);
  }
  return html`<${Sheet} title=${p.isNew?(sect?'New section':'New question'):(sect?'Edit section':'Edit question')} onClose=${p.onClose}
    foot=${html`<${React.Fragment}>
      <button className="btn" onClick=${p.onClose}>Cancel</button>
      <button className="btn btn-primary btn-block" onClick=${save}>${sect?'Save section':'Save question'}</button>
    <//>`}>
    <div className="stack" style=${{paddingTop:'14px'}}>
      <div className="card stack-sm">
        <label className="field"><span className="lbl">${sect?'Section heading':'Question'}</span>
          <textarea value=${q.label||''} placeholder=${sect?'Name this part of the form':'What do you want to ask?'}
            onChange=${function(e){ up({label:e.target.value}); }} style=${{minHeight:'72px'}}></textarea></label>
        <label className="field"><span className="lbl">${sect?'Description (optional)':'Helper text (optional)'}</span>
          <input type="text" value=${sect?(q.description||''):(q.help||'')}
            placeholder=${sect?'Shown under the heading':'Shown under the question'}
            onChange=${function(e){ up(sect?{description:e.target.value}:{help:e.target.value}); }}/></label>
        <label className="field"><span className="lbl">Type</span>
          <select value=${q.type} onChange=${function(e){
            var t=e.target.value;
            var patch={type:t};
            if(isChoice(t) && !(q.options||[]).length) patch.options=['Option 1','Option 2'];
            if(t==='linear_scale'){ patch.min=q.min===undefined?1:q.min; patch.max=q.max===undefined?5:q.max; }
            if(isSection(t)) patch.required=false;
            up(patch);
          }}>
            ${TYPES.map(function(t){ return html`<option key=${t[0]} value=${t[0]}>${t[1]}</option>`; })}
          </select></label>
        ${sect?html`<p className="tiny muted">A section groups the questions that follow it, up to the next section. It collects no answer and gets no column in the export.</p>`
          :html`<label className="opt" style=${{marginTop:'4px'}}>
          <input type="checkbox" checked=${!!q.required} onChange=${function(e){ up({required:e.target.checked}); }}/>
          <span>Required — the entry can't be saved without it</span></label>`}
      </div>

      <div className="card">
        <h3>${sect?'Show this section only if…':'Show this question only if…'}</h3>
        <p className="small muted" style=${{marginTop:'5px'}}>
          ${sect?'Hiding a section hides every question under it, up to the next section.':'Leave this as “Always show” to ask it every time.'}</p>
        ${parents.length===0?html`<p className="small muted" style=${{marginTop:'10px'}}>
          Nothing to depend on yet — a condition can only point at a question that comes before this one.</p>`
        :html`<div className="stack-sm" style=${{marginTop:'10px'}}>
          <select value=${cond.q||''} onChange=${function(e){
            var id=e.target.value;
            if(!id) up({showIf:undefined}); else up({showIf:{q:id, op:cond.op||'any', values:[]}});
          }}>
            <option value="">Always show</option>
            ${parents.map(function(x){ return html`<option key=${x.id} value=${x.id}>${x.label||'Untitled'}</option>`; })}
          </select>
          ${cond.q?html`<${React.Fragment}>
            <select value=${cond.op||'any'} onChange=${function(e){
              up({showIf:Object.assign({},cond,{op:e.target.value, values:e.target.value==='answered'?[]:(cond.values||[])})});
            }}>
              ${COND_OPS.map(function(o){ return html`<option key=${o[0]} value=${o[0]}>${o[1]}</option>`; })}
            </select>
            ${cond.op!=='answered'?(parentChoices.length?html`<div className="opts">
              ${parentChoices.map(function(o){
                var on=(cond.values||[]).map(String).indexOf(String(o))>=0;
                return html`<label key=${o} className=${'opt'+(on?' on':'')}>
                  <input type="checkbox" checked=${on} onChange=${function(){
                    var vals=(cond.values||[]).map(String);
                    up({showIf:Object.assign({},cond,{values:on?vals.filter(function(x){return x!==String(o);}):vals.concat([String(o)])})});
                  }}/><span>${o}</span></label>`;
              })}
            </div>`:html`<label className="field"><span className="lbl small">Answers that reveal it, separated by semicolons</span>
              <input type="text" value=${(cond.values||[]).join('; ')} onChange=${function(e){
                up({showIf:Object.assign({},cond,{values:e.target.value.split(';').map(function(x){return x.trim();}).filter(Boolean)})});
              }}/></label>`):null}
            <p className="small">${condSummary(Object.assign({},q,{showIf:cond}), p.available)}</p>
          <//>`:null}
        </div>`}
      </div>

      ${(!sect&&isChoice(q.type))?html`<div className="card">
        <h3>Options</h3>
        <div className="stack-sm" style=${{marginTop:'10px'}}>
          ${(q.options||[]).map(function(o,i){
            return html`<div className="row" key=${i}>
              <input type="text" value=${o} onChange=${function(e){ setOpt(i,e.target.value); }}/>
              <button className="iconbtn" aria-label="Move up" onClick=${function(){moveOpt(i,-1);}}><${Icon} n="up"/><//>
              <button className="iconbtn" aria-label="Move down" onClick=${function(){moveOpt(i,1);}}><${Icon} n="down"/><//>
              <button className="iconbtn" aria-label="Remove option" onClick=${function(){delOpt(i);}}><${Icon} n="close"/><//>
            </div>`;
          })}
          <button className="btn btn-sm" onClick=${addOpt}>Add option</button>
        </div>
      </div>`:null}

      ${q.type==='linear_scale'?html`<div className="card stack-sm">
        <h3>Scale</h3>
        <div className="row">
          <label className="field" style=${{flex:1}}><span className="lbl small">From</span>
            <input type="number" value=${q.min===undefined?1:q.min} onChange=${function(e){ up({min:e.target.value}); }}/></label>
          <label className="field" style=${{flex:1}}><span className="lbl small">To</span>
            <input type="number" value=${q.max===undefined?5:q.max} onChange=${function(e){ up({max:e.target.value}); }}/></label>
        </div>
        <div className="row">
          <label className="field" style=${{flex:1}}><span className="lbl small">Label for lowest</span>
            <input type="text" value=${q.minLabel||''} onChange=${function(e){ up({minLabel:e.target.value}); }}/></label>
          <label className="field" style=${{flex:1}}><span className="lbl small">Label for highest</span>
            <input type="text" value=${q.maxLabel||''} onChange=${function(e){ up({maxLabel:e.target.value}); }}/></label>
        </div>
      </div>`:null}

      ${q.type==='number'?html`<div className="card">
        <h3>Allowed range (optional)</h3>
        <div className="row" style=${{marginTop:'10px'}}>
          <label className="field" style=${{flex:1}}><span className="lbl small">Minimum</span>
            <input type="number" value=${q.min===undefined?'':q.min} onChange=${function(e){ up({min:e.target.value===''?undefined:Number(e.target.value)}); }}/></label>
          <label className="field" style=${{flex:1}}><span className="lbl small">Maximum</span>
            <input type="number" value=${q.max===undefined?'':q.max} onChange=${function(e){ up({max:e.target.value===''?undefined:Number(e.target.value)}); }}/></label>
        </div>
      </div>`:null}

      ${sect?null:html`<div className="card">
        <h3>Image with the question</h3>
        <p className="small muted" style=${{marginTop:'4px'}}>Shown above the question — useful for showing a card, photo or prompt to the respondent.</p>
        <div className="stack-sm" style=${{marginTop:'10px'}}>
          ${q.imageUrl?html`<img className="thumb" src=${q.imageUrl} alt=""/>`:null}
          <div className="row">
            <label className="btn btn-sm" style=${{flex:1}}>${q.imageUrl?'Replace image':'Attach image'}
              <input type="file" accept="image/*" style=${{display:'none'}} onChange=${function(e){
                var f=e.target.files&&e.target.files[0]; if(!f) return;
                readImage(f,1000,0.7).then(function(d){ up({imageUrl:d}); },function(err){ UI.toast(err.message); });
                e.target.value='';
              }}/></label>
            ${q.imageUrl?html`<button className="btn btn-sm btn-danger" onClick=${function(){ up({imageUrl:undefined}); }}>Remove</button>`:null}
          </div>
        </div>
      </div>`}

      <div className="card">
        <h3>Preview</h3>
        <div style=${{marginTop:'10px'}}>
          <${Field} q=${q} value=${undefined} onChange=${function(){}}/>
        </div>
      </div>
    </div>
  <//>`;
}

/* ============================ Questionnaire editor ============================ */
function QuestionnaireEditor(p){
  var s1=useState(clone(p.questionnaire)), q=s1[0], setQ=s1[1];
  var s2=useState(null), qe=s2[0], setQe=s2[1]; // {question, isNew}
  var s3=useState(null), dragId=s3[0], setDragId=s3[1];
  var s4=useState(false), saving=s4[0], setSaving=s4[1];
  var baseSig=useRef(questionsSignature(p.questionnaire.questions));
  var hasResponses=p.responseCount>0;

  function up(patch){ setQ(function(prev){ return Object.assign({},prev,patch); }); }
  function setQuestions(list){
    var r=sanitizeConditions(list.map(function(x,i){ return Object.assign({},x,{order:i}); }));
    if(r.cleared.length) UI.toast('Condition cleared on: '+r.cleared.join(', ')+' — it pointed at a question that no longer comes before it');
    up({questions:r.questions});
  }
  function addQuestion(type){
    setQe({isNew:true, question:{id:uid(), order:(q.questions||[]).length,
      type:type||'short_text', label:'', required:false}});
  }
  function availableFor(qq){
    var list=(q.questions||[]).slice().sort(byOrder);
    var i=list.findIndex(function(x){ return x.id===qq.id; });
    return i<0?list:list.slice(0,i);
  }
  function saveQuestion(qq){
    var list=(q.questions||[]).slice();
    var i=list.findIndex(function(x){ return x.id===qq.id; });
    if(i>=0) list[i]=qq; else list.push(qq);
    setQuestions(list); setQe(null);
  }
  function delQuestion(qq){
    var dependents=(q.questions||[]).filter(function(x){ return x.showIf&&x.showIf.q===qq.id; });
    UI.confirm({
      title:isSection(qq.type)?'Delete this section heading?':'Delete this question?',
      message: (dependents.length?(dependents.length+' other '+(dependents.length===1?'question depends':'questions depend')+' on this one; '+(dependents.length===1?'its condition':'their conditions')+' will be cleared so '+(dependents.length===1?'it is':'they are')+' always shown.\n\n'):'')
        + (hasResponses
        ? 'This form already has '+p.responseCount+' responses. Deleting removes it from future entries only — answers already collected stay in the export under the old form version.'
        : 'It will be removed from the form.'),
      danger:true, okText:'Delete'
    }).then(function(yes){
      if(!yes) return;
      setQuestions((q.questions||[]).filter(function(x){ return x.id!==qq.id; }));
    });
  }
  function move(i,d){
    var list=(q.questions||[]).slice(); var j=i+d; if(j<0||j>=list.length) return;
    var t=list[i]; list[i]=list[j]; list[j]=t; setQuestions(list);
  }
  function onDrop(targetId){
    if(!dragId||dragId===targetId) return;
    var list=(q.questions||[]).slice();
    var from=list.findIndex(function(x){return x.id===dragId;});
    var to=list.findIndex(function(x){return x.id===targetId;});
    if(from<0||to<0) return;
    var moved=list.splice(from,1)[0];
    list.splice(to,0,moved);
    setQuestions(list); setDragId(null);
  }
  function save(){
    if(!String(q.title||'').trim()){ UI.toast('Give the questionnaire a title'); return; }
    var changed=questionsSignature(q.questions)!==baseSig.current;
    setSaving(true);
    var go=function(){
      saveQuestionnaire(Object.assign({},q,{title:String(q.title).trim(), targetCount:Number(q.targetCount)||0}),
                        {bumpVersion:changed})
        .then(function(saved){ setSaving(false); UI.toast('Questionnaire saved'); p.onSaved(saved); },
              function(e){ setSaving(false); UI.toast('Could not save: '+(e.message||e)); });
    };
    if(changed && hasResponses){
      UI.confirm({title:'Change the form structure?',
        message:'You have changed the questions and this form already has '+p.responseCount+' responses. Saving creates version '+((q.version||1)+1)+'. Existing responses keep version '+(q.version||1)+' and stay readable in exports.',
        okText:'Save as version '+((q.version||1)+1)}).then(function(yes){ if(yes) go(); else setSaving(false); });
    } else go();
  }

  return html`<${Sheet} title=${p.isNew?'New questionnaire':'Edit questionnaire'} onClose=${p.onClose}
    foot=${html`<${React.Fragment}>
      <button className="btn" onClick=${p.onClose}>Cancel</button>
      <button className="btn btn-primary btn-block" disabled=${saving} onClick=${save}>Save questionnaire</button>
    <//>`}>
    <div className="stack" style=${{paddingTop:'14px'}}>
      <div className="card stack-sm">
        <label className="field"><span className="lbl">Title</span>
          <input type="text" value=${q.title||''} placeholder="e.g. Household diarrhoea survey"
            onChange=${function(e){ up({title:e.target.value}); }}/></label>
        <label className="field"><span className="lbl">Description</span>
          <textarea value=${q.description||''} placeholder="Notes for yourself — where and why this is collected"
            onChange=${function(e){ up({description:e.target.value}); }} style=${{minHeight:'70px'}}></textarea></label>
        <label className="field"><span className="lbl">Target number of responses</span>
          <input type="number" min="0" value=${q.targetCount===undefined?'':q.targetCount}
            onChange=${function(e){ up({targetCount:e.target.value===''?'':Number(e.target.value)}); }}/></label>
        <p className="tiny muted num">Version ${q.version||1}${hasResponses?(' · '+p.responseCount+' responses collected'):''}</p>
      </div>

      <div className="row-between">
        <h2>Questions (${answerable(q.questions).length})</h2>
        <div className="row" style=${{gap:'8px'}}>
          <button className="btn btn-sm" onClick=${function(){ addQuestion('section'); }}>Add section</button>
          <button className="btn btn-sm btn-primary" onClick=${function(){ addQuestion('short_text'); }}>Add question</button>
        </div>
      </div>

      ${(q.questions||[]).length===0?html`<div className="empty">No questions yet. Add the first one.</div>`:null}

      <div>
        ${(q.questions||[]).map(function(qq,i){
          return html`<div key=${qq.id} className=${'qcard'+(dragId===qq.id?' drag-over':'')+(isSection(qq.type)?' active':'')} draggable=${true}
            onDragStart=${function(){ setDragId(qq.id); }}
            onDragOver=${function(e){ e.preventDefault(); }}
            onDrop=${function(e){ e.preventDefault(); onDrop(qq.id); }}
            onDragEnd=${function(){ setDragId(null); }}>
            <div className="row-between">
              <div style=${{minWidth:0,flex:1}}>
                <div className="row" style=${{gap:'8px'}}>
                  <span className="tiny muted num">${i+1}</span>
                  <span style=${{fontWeight:isSection(qq.type)?680:580,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
                    ${qq.label||(isSection(qq.type)?'Untitled section':'Untitled question')}</span>
                </div>
                <div className="tiny muted" style=${{marginTop:'3px'}}>
                  ${typeLabel(qq.type)}${qq.required?' · required':''}${qq.imageUrl?' · image':''}
                  ${isChoice(qq.type)?(' · '+(qq.options||[]).length+' options'):''}
                </div>
                ${qq.showIf&&qq.showIf.q?html`<div className="cond-note" style=${{marginTop:'5px'}}>
                  ${condSummary(qq,q.questions)}</div>`:null}
              </div>
            </div>
            <div className="row" style=${{marginTop:'10px',gap:'6px'}}>
              <button className="iconbtn" aria-label="Move up" disabled=${i===0} onClick=${function(){move(i,-1);}}><${Icon} n="up"/><//>
              <button className="iconbtn" aria-label="Move down" disabled=${i===(q.questions||[]).length-1} onClick=${function(){move(i,1);}}><${Icon} n="down"/><//>
              <div style=${{flex:1}}></div>
              <button className="btn btn-sm" onClick=${function(){ setQe({isNew:false,question:qq}); }}>Edit</button>
              <button className="btn btn-sm btn-danger" onClick=${function(){ delQuestion(qq); }}>Delete</button>
            </div>
          </div>`;
        })}
      </div>
      <p className="tiny muted">Drag a card to reorder on a computer, or use the arrows on a phone.</p>
    </div>

    ${qe?html`<${QuestionEditor} key=${qe.question.id} question=${qe.question} isNew=${qe.isNew}
      available=${availableFor(qe.question)}
      onClose=${function(){ setQe(null); }} onSave=${saveQuestion}/>`:null}
  <//>`;
}

/* ============================ import + guide UI ============================ */
var AI_PROMPT =
'I have a draft survey questionnaire attached (PDF or Word document). Please convert it into an Excel file with exactly these columns, one row per question, in this exact order:\n\n'+
'Order | Question Type | Label | Options | Required | Image Filename | Show If Question | Show If Condition | Show If Values\n\n'+
'Rules:\n\n'+
'- Order: sequential integer starting at 1, matching the order questions and headings appear in my draft.\n'+
'- Question Type: must be exactly one of: section, short_text, long_text, multiple_choice, checkbox, dropdown, linear_scale, date, number, image_upload\n'+
'  - Use section for a heading that groups the questions under it (e.g. "Part B: Household characteristics"). A section row carries no answer: leave Options and Required blank. A section groups every row after it until the next section row.\n'+
'  - Use multiple_choice for "select one" questions\n'+
'  - Use checkbox for "select all that apply" questions\n'+
'  - Use short_text for brief open answers, long_text for paragraph-length open answers\n'+
'  - Use linear_scale for rating/scale questions (e.g. 1-5, 1-10)\n'+
'  - Use dropdown only if my draft explicitly says "dropdown" or "select from list"\n'+
'- Label: the exact question text or heading, cleaned of numbering.\n'+
'- Options: for multiple_choice, checkbox, and dropdown questions, list all options separated by semicolons (;). For linear_scale, put the min and max separated by a semicolon (e.g. "1;5"). Leave blank for all other types, including section.\n'+
'- Required: Y if the question appears mandatory in my draft (or is not marked optional), N if explicitly marked optional. Leave blank for section rows.\n'+
'- Image Filename: leave blank unless my draft references an attached image for a question, in which case name it descriptively (e.g. "q3_diagram.png") — I will attach matching image files separately.\n\n'+
'Skip logic — this is important, my draft uses it:\n\n'+
'- Whenever my draft says something like "If yes, ...", "If no, skip to Q12", "Ask only if...", or indents a sub-question under a parent answer, express it with the last three columns instead of leaving it in the question text.\n'+
'- Show If Question: the Order number of the EARLIER row whose answer controls this row. It must be a number that appears in the Order column above this row, and it must not be a section row. Leave blank when the row is always asked.\n'+
'- Show If Condition: one of "is one of", "is not one of", or "answered". Blank means "is one of".\n'+
'- Show If Values: the answers that reveal this row, separated by semicolons. They must be spelled exactly as they appear in that earlier row\'s Options column (e.g. Yes). Leave blank when the condition is "answered".\n'+
'- To make a whole group conditional, put the condition on the section row — that hides every row under it up to the next section.\n'+
'- Remove any "If yes," or "(skip if no)" wording from the Label once it is expressed in these columns.\n\n'+
'If any question in my draft is ambiguous or you are unsure of the correct Question Type or skip logic, add a row anyway with your best guess and add a note in a comment/second sheet listing which rows need my manual review. Do not skip any questions. Output the result as an actual .xlsx file I can download, not just a text table.';

function ImportReview(p){
  // p: draft {title, questions, warnings, source}, existing, onCancel, onDone
  var s1=useState(p.draft.title||''), title=s1[0], setTitle=s1[1];
  var s2=useState(p.draft.questions), qs=s2[0], setQs=s2[1];
  var s3=useState({}), images=s3[0], setImages=s3[1];
  var s4=useState(null), edit=s4[0], setEdit=s4[1];
  var s5=useState(false), saving=s5[0], setSaving=s5[1];

  var wanted=useMemo(function(){
    var out=[]; qs.forEach(function(q){ if(q.imageFilename) out.push(String(q.imageFilename).trim()); });
    return out;
  },[qs]);
  var matched=wanted.filter(function(f){ return images[f.toLowerCase()]; }).length;
  var uncertain=qs.filter(function(q){ return q._uncertain; }).length;
  var sectionCount=qs.filter(function(q){ return isSection(q.type); }).length;
  var condCount=qs.filter(function(q){ return q.showIf&&q.showIf.q; }).length;

  function reorder(list){
    var r=sanitizeConditions(list.map(function(q,i){ return Object.assign({},q,{order:i}); }));
    if(r.cleared.length) UI.toast('Condition cleared on: '+r.cleared.join(', '));
    setQs(r.questions);
  }
  function availableFor(qq){
    var i=qs.findIndex(function(x){ return x.id===qq.id; });
    return i<0?qs:qs.slice(0,i);
  }
  function move(i,d){
    var l=qs.slice(), j=i+d; if(j<0||j>=l.length) return;
    var t=l[i]; l[i]=l[j]; l[j]=t; reorder(l);
  }
  function removeQ(q){
    var dep=qs.filter(function(x){ return x.showIf&&x.showIf.q===q.id; }).length;
    UI.confirm({title:isSection(q.type)?'Remove this section from the import?':'Remove this question from the import?',
      message:q.label+(dep?('\n\n'+dep+' later '+(dep===1?'question depends':'questions depend')+' on it; '+(dep===1?'its condition':'their conditions')+' will be cleared.'):''),
      danger:true,okText:'Remove'})
      .then(function(yes){ if(yes) reorder(qs.filter(function(x){ return x.id!==q.id; })); });
  }
  function pickImages(files){
    var jobs=[];
    for(var i=0;i<files.length;i++){
      (function(f){
        jobs.push(readImage(f,1000,0.7).then(function(d){ return [f.name.toLowerCase(),d]; },function(){ return null; }));
      })(files[i]);
    }
    Promise.all(jobs).then(function(pairs){
      var next=Object.assign({},images);
      pairs.forEach(function(pr){ if(pr) next[pr[0]]=pr[1]; });
      setImages(next);
      var got=wanted.filter(function(f){ return next[f.toLowerCase()]; }).length;
      UI.toast(got+' of '+wanted.length+' images matched');
    });
  }
  function confirmImport(){
    var t=String(title).trim();
    if(!t){ UI.toast('Give the questionnaire a title'); return; }
    if(!qs.length){ UI.toast('There are no questions to import'); return; }
    var finalTitle=uniqueTitle(t,p.existing);
    var go=function(){
      setSaving(true);
      var questions=sanitizeConditions(stripDraftFlags(applyImages(qs,images))).questions;
      saveQuestionnaire({id:uid(), title:finalTitle, description:p.draft.description||'', version:1,
        targetCount:0, questions:questions, createdAt:nowISO(), updatedAt:nowISO()})
        .then(function(saved){ setSaving(false); UI.toast('Imported “'+finalTitle+'” · '+questions.length+' questions'); p.onDone(saved); },
              function(e){ setSaving(false); UI.toast('Import failed: '+(e.message||e)); });
    };
    if(finalTitle!==t){
      UI.confirm({title:'A questionnaire already uses that name',
        message:'Importing never overwrites an existing form. This one will be saved as “'+finalTitle+'”. You can rename it afterwards.',
        okText:'Import as “'+finalTitle+'”'}).then(function(yes){ if(yes) go(); });
    } else go();
  }

  return html`<${Sheet} title="Review before importing" onClose=${p.onCancel}
    foot=${html`<${React.Fragment}>
      <button className="btn" onClick=${p.onCancel}>Cancel</button>
      <button className="btn btn-primary btn-block" disabled=${saving||!qs.length} onClick=${confirmImport}>
        ${saving?'Importing…':'Confirm import'}</button>
    <//>`}>
    <div className="stack" style=${{paddingTop:'14px'}}>
      <div className="banner info">
        Nothing is saved until you tap Confirm import. ${answerable(qs).length} questions${sectionCount?(' in '+sectionCount+' '+(sectionCount===1?'section':'sections')):''}${condCount?(', '+condCount+' shown conditionally'):''} ready${p.draft.source==='document'?', parsed from your document':''}.
      </div>
      ${uncertain>0?html`<div className="banner warn">
        ${uncertain} ${uncertain===1?'question was':'questions were'} guessed and need checking — they are marked below. Open each one and set the answer type yourself.
      </div>`:null}
      ${(p.draft.warnings||[]).length?html`<div className="card">
        <h3>Warnings</h3>
        <ul className="small muted" style=${{margin:'8px 0 0',paddingLeft:'18px'}}>
          ${p.draft.warnings.map(function(w,i){ return html`<li key=${i}>Row ${w.row}: ${w.message}</li>`; })}
        </ul>
      </div>`:null}

      <div className="card">
        <label className="field"><span className="lbl">Questionnaire title</span>
          <input type="text" value=${title} onChange=${function(e){ setTitle(e.target.value); }}/></label>
      </div>

      ${wanted.length?html`<div className="card">
        <h3>Images</h3>
        <p className="small muted" style=${{marginTop:'5px'}}>
          ${wanted.length} ${wanted.length===1?'question refers':'questions refer'} to an image file. Select them from this device — they are matched by filename.</p>
        <label className="btn btn-sm btn-block" style=${{marginTop:'10px'}}>Choose image files
          <input type="file" accept="image/*" multiple style=${{display:'none'}}
            onChange=${function(e){ if(e.target.files&&e.target.files.length) pickImages(e.target.files); e.target.value=''; }}/></label>
        <p className="small" style=${{marginTop:'8px'}}>
          <b className="num">${matched} of ${wanted.length}</b> matched.
          ${matched<wanted.length?html`<span className="muted"> Missing: ${wanted.filter(function(f){ return !images[f.toLowerCase()]; }).join(', ')} — you can import without them and attach later.</span>`:null}
        </p>
      </div>`:null}

      <h2>Questions as they will appear</h2>
      ${qs.map(function(q,i){
        return html`<div key=${q.id}>
          ${q._uncertain?html`<p className="tiny" style=${{color:'var(--pending)',fontWeight:600,margin:'0 0 4px 2px'}}>
            Guessed as ${typeLabel(q.type)} — please check</p>`:null}
          <${Field} q=${applyImages([q],images)[0]} value=${undefined} onChange=${function(){}}
            conditional=${!!(q.showIf&&q.showIf.q)} note=${condSummary(q,qs)}/>
          <div className="row" style=${{margin:'-4px 0 12px',gap:'6px'}}>
            <span className="tiny muted num">${i+1} · ${typeLabel(q.type)}${q.required?' · required':''}</span>
            <div style=${{flex:1}}></div>
            <button className="iconbtn" aria-label="Move up" disabled=${i===0} onClick=${function(){move(i,-1);}}><${Icon} n="up"/><//>
            <button className="iconbtn" aria-label="Move down" disabled=${i===qs.length-1} onClick=${function(){move(i,1);}}><${Icon} n="down"/><//>
            <button className="btn btn-sm" onClick=${function(){ setEdit(q); }}>Edit</button>
            <button className="btn btn-sm btn-danger" onClick=${function(){ removeQ(q); }}>Remove</button>
          </div>
        </div>`;
      })}
      ${!qs.length?html`<div className="empty">Every question was removed. Cancel and start again.</div>`:null}
    </div>

    ${edit?html`<${QuestionEditor} key=${edit.id} question=${edit} isNew=${false}
      available=${availableFor(edit)}
      onClose=${function(){ setEdit(null); }}
      onSave=${function(saved){
        reorder(qs.map(function(x){
          if(x.id!==saved.id) return x;
          var merged=Object.assign({},saved); delete merged._uncertain; return merged;
        }));
        setEdit(null);
      }}/>`:null}
  <//>`;
}

function ImportSheet(p){
  var s1=useState(null), draft=s1[0], setDraft=s1[1];
  var s2=useState(null), errors=s2[0], setErrors=s2[1];
  var s3=useState(''), busy=s3[0], setBusy=s3[1];
  var s4=useState(''), fileName=s4[0], setFileName=s4[1];

  function handleSheet(file){
    setErrors(null); setBusy('Reading '+file.name+'…'); setFileName(file.name);
    readWorkbookRows(file).then(function(aoa){
      var r=validateImportRows(aoa);
      setBusy('');
      if(r.errors.length){ setErrors(r.errors); return; }
      setDraft({title:file.name.replace(/\.[^.]+$/,''), questions:r.questions, warnings:r.warnings, source:'template'});
    },function(e){ setBusy(''); setErrors([{row:0,message:e.message||String(e)}]); });
  }
  function handleDoc(file){
    setErrors(null); setFileName(file.name);
    var isPdf=/\.pdf$/i.test(file.name), isDocx=/\.docx$/i.test(file.name);
    if(!isPdf && !isDocx){ setErrors([{row:0,message:'Upload a .docx or .pdf file.'}]); return; }
    setBusy('Reading '+file.name+'… this can take a moment');
    (isPdf?extractPdf(file):extractDocx(file)).then(function(text){
      var r=parseDocumentText(text);
      setBusy('');
      if(!r.questions.length){
        setErrors([{row:0,message:'No questions could be picked out of that document. Number your questions (1., 2., 3.) and try again, or use the Guide to convert it with an AI assistant.'}]);
        return;
      }
      setDraft({title:file.name.replace(/\.[^.]+$/,''), questions:r.questions, warnings:[], source:'document'});
    },function(e){ setBusy(''); setErrors([{row:0,message:e.message||String(e)}]); });
  }

  return html`<${Sheet} title="Import a questionnaire" onClose=${p.onClose}>
    <div className="stack" style=${{paddingTop:'14px'}}>
      ${busy?html`<div className="banner info">${busy}</div>`:null}
      ${errors?html`<div className="card" style=${{borderColor:'var(--fail)'}}>
        <h3 style=${{color:'var(--fail)'}}>${fileName} was not imported</h3>
        <p className="small muted" style=${{marginTop:'5px'}}>Nothing was saved. Fix these rows in the file and upload it again.</p>
        <ul className="small" style=${{margin:'10px 0 0',paddingLeft:'18px'}}>
          ${errors.map(function(e,i){ return html`<li key=${i} style=${{marginBottom:'4px'}}>
            ${e.row?html`<b>Row ${e.row}: </b>`:null}${e.message}</li>`; })}
        </ul>
      </div>`:null}

      <div className="card">
        <h2>From the Excel template</h2>
        <p className="small muted" style=${{marginTop:'6px'}}>
          The reliable path. Every row is checked before anything is saved, and you see the finished form before confirming.</p>
        <div className="row" style=${{marginTop:'12px'}}>
          <button className="btn" style=${{flex:1}} onClick=${function(){ downloadTemplate(); UI.toast('Template downloaded'); }}>Download template</button>
        </div>
        <label className="btn btn-primary btn-block" style=${{marginTop:'10px'}}>Upload filled template
          <input type="file" accept=".xlsx,.xls,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
            style=${{display:'none'}} onChange=${function(e){ var f=e.target.files&&e.target.files[0]; if(f) handleSheet(f); e.target.value=''; }}/></label>
        <p className="tiny muted" style=${{marginTop:'8px'}}>
          Columns: ${IMPORT_HEADERS.join(' | ')}</p>
      </div>

      <div className="card">
        <h2>From a Word or PDF draft</h2>
        <p className="small muted" style=${{marginTop:'6px'}}>
          A rough first pass. The app reads numbered questions and lettered options and guesses the answer type — you check and fix every question on the next screen before it is saved. Nothing is ever overwritten.</p>
        <label className="btn btn-block" style=${{marginTop:'12px'}}>Upload .docx or .pdf
          <input type="file" accept=".docx,.pdf,application/pdf" style=${{display:'none'}}
            onChange=${function(e){ var f=e.target.files&&e.target.files[0]; if(f) handleDoc(f); e.target.value=''; }}/></label>
        <button className="btn-ghost btn btn-sm" style=${{marginTop:'6px'}} onClick=${p.onGuide}>
          Better results: convert it with an AI assistant first</button>
      </div>
    </div>

    ${draft?html`<${ImportReview} draft=${draft} existing=${p.existing}
      onCancel=${function(){ setDraft(null); }}
      onDone=${function(saved){ setDraft(null); p.onImported(saved); }}/>`:null}
  <//>`;
}

function QuestionnairePage(p){
  var s1=useState(null), ed=s1[0], setEd=s1[1];
  var s2=useState(false), imp=s2[0], setImp=s2[1];
  var s3=useState(false), guide=s3[0], setGuide=s3[1];
  var counts=p.countsByQ;

  function newQ(){
    setEd({isNew:true, questionnaire:{id:uid(), title:'', description:'', version:1, targetCount:0,
      questions:[], createdAt:nowISO(), updatedAt:nowISO()}});
  }
  function duplicate(q){
    var copy=clone(q);
    copy.id=uid(); copy.title=q.title+' (copy)'; copy.version=1; copy.createdAt=nowISO();
    copy.questions=(copy.questions||[]).map(function(x){ return Object.assign({},x,{id:uid()}); });
    saveQuestionnaire(copy).then(function(){ UI.toast('Duplicated'); p.refresh(); });
  }
  function remove(q){
    var n=counts[q.id]||0;
    UI.confirm({
      title:'Delete “'+q.title+'”?',
      message: n>0
        ? 'This deletes the form AND its '+n+' collected responses from this device. Export or sync them first — this cannot be undone.'
        : 'This form has no responses. It will be removed permanently.',
      danger:true, okText:'Delete permanently',
      typeToConfirm: n>0 ? 'DELETE' : null
    }).then(function(yes){
      if(!yes) return;
      responsesFor(q.id).then(function(rs){
        return tx(['questionnaires','responses','drafts','versions'],'readwrite',function(a){
          a.questionnaires.delete(q.id);
          rs.forEach(function(r){ a.responses.delete(r.entryId); });
          a.drafts.delete('new:'+q.id);
          rs.forEach(function(r){ a.drafts.delete('entry:'+r.entryId); });
          a.versions.openCursor().onsuccess=function(ev){
            var c=ev.target.result; if(!c) return;
            if(c.value.questionnaireId===q.id) c.delete();
            c.continue();
          };
        });
      }).then(function(){
        if(p.settings.activeQuestionnaireId===q.id) return setSetting('activeQuestionnaireId',null);
      }).then(function(){ UI.toast('Deleted'); p.refresh(); });
    });
  }

  return html`<div className="wrap"><div className="stack" style=${{paddingTop:'14px'}}>
    <div className="row-between">
      <h1>Questionnaires</h1>
      <button className="btn btn-sm btn-primary" onClick=${newQ}>New</button>
    </div>
    <div className="row">
      <button className="btn btn-sm" style=${{flex:1}} onClick=${function(){ setImp(true); }}>Import questionnaire</button>
      <button className="btn btn-sm" onClick=${function(){ setGuide(true); }}>Guide</button>
    </div>
    ${p.questionnaires.length===0?html`<div className="card empty">
      No questionnaires yet. Create one and add your questions.
    </div>`:null}
    ${p.questionnaires.map(function(q){
      var active=p.settings.activeQuestionnaireId===q.id;
      var n=counts[q.id]||0;
      return html`<div key=${q.id} className=${'card'+(active?' qcard active':'')}>
        <div className="row-between">
          <h2 style=${{minWidth:0}}>${q.title||'Untitled'}</h2>
          ${active?html`<span className="badge synced">Active</span>`:null}
        </div>
        ${q.description?html`<p className="small muted" style=${{marginTop:'5px'}}>${q.description}</p>`:null}
        <p className="tiny muted num" style=${{marginTop:'7px'}}>
          v${q.version} · ${answerable(q.questions).length} questions${answerable(q.questions).length!==(q.questions||[]).length?(' · '+((q.questions||[]).length-answerable(q.questions).length)+' sections'):''} · ${n} responses${q.targetCount?(' · target '+q.targetCount):''}</p>
        <div className="row" style=${{marginTop:'12px',flexWrap:'wrap',gap:'8px'}}>
          ${!active?html`<button className="btn btn-sm" onClick=${function(){
            p.onSetActive(q.id); UI.toast('Now collecting for “'+q.title+'”');
          }}>Set active</button>`:null}
          <button className="btn btn-sm" onClick=${function(){ setEd({isNew:false,questionnaire:q}); }}>Edit</button>
          <button className="btn btn-sm" onClick=${function(){ duplicate(q); }}>Duplicate</button>
          <button className="btn btn-sm btn-danger" onClick=${function(){ remove(q); }}>Delete</button>
        </div>
      </div>`;
    })}
  </div>

  ${imp?html`<${ImportSheet} existing=${p.questionnaires}
    onClose=${function(){ setImp(false); }}
    onGuide=${function(){ setGuide(true); }}
    onImported=${function(saved){
      setImp(false); p.refresh();
      if(!p.settings.activeQuestionnaireId) p.onSetActive(saved.id);
    }}/>`:null}
  ${guide?html`<${GuideSheet} onClose=${function(){ setGuide(false); }}
    onOpenImport=${function(){ setGuide(false); setImp(true); }}/>`:null}

  ${ed?html`<${QuestionnaireEditor} key=${ed.questionnaire.id} questionnaire=${ed.questionnaire} isNew=${ed.isNew}
    responseCount=${counts[ed.questionnaire.id]||0}
    onClose=${function(){ setEd(null); }}
    onSaved=${function(saved){
      setEd(null); p.refresh();
      if(!p.settings.activeQuestionnaireId) p.onSetActive(saved.id);
    }}/>`:null}
  </div>`;
}

var APPS_SCRIPT_CODE =
'function doPost(e) {\n'+
'  var lock = LockService.getScriptLock();\n'+
'  lock.waitLock(30000);\n'+
'  try {\n'+
'    var d = JSON.parse(e.postData.contents);\n'+
'    if (d.action === "ping") return out({ ok: true, message: "SurveyScholar connected" });\n'+
'    var ss = SpreadsheetApp.getActiveSpreadsheet();\n'+
'    var name = String(d.questionnaire.title || "Responses").substring(0, 90);\n'+
'    var sh = ss.getSheetByName(name) || ss.insertSheet(name);\n'+
'    var meta = ["Entry ID", "Timestamp", "Last updated", "Interviewer", "Form version", "Deleted"];\n'+
'    var labels = d.questions.map(function (q) { return q.label; });\n'+
'    var header = sh.getLastRow() > 0 ? sh.getRange(1, 1, 1, sh.getLastColumn()).getValues()[0] : [];\n'+
'    if (!header.length) { header = meta.concat(labels); sh.getRange(1, 1, 1, header.length).setValues([header]); }\n'+
'    else {\n'+
'      var add = meta.concat(labels).filter(function (l) { return header.indexOf(l) === -1; });\n'+
'      if (add.length) { sh.getRange(1, header.length + 1, 1, add.length).setValues([add]); header = header.concat(add); }\n'+
'    }\n'+
'    var row = new Array(header.length).fill("");\n'+
'    function put(label, val) { var i = header.indexOf(label); if (i > -1) row[i] = val; }\n'+
'    put("Entry ID", d.entry.entryId);\n'+
'    put("Timestamp", d.entry.createdAt);\n'+
'    put("Last updated", d.entry.updatedAt);\n'+
'    put("Interviewer", d.interviewer);\n'+
'    put("Form version", d.questionnaire.version);\n'+
'    put("Deleted", d.entry.deleted ? "DELETED " + d.entry.deletedAt : "");\n'+
'    d.questions.forEach(function (q) { put(q.label, d.entry.answers[q.id]); });\n'+
'    var ids = sh.getLastRow() > 1 ? sh.getRange(2, 1, sh.getLastRow() - 1, 1).getValues() : [];\n'+
'    var at = -1;\n'+
'    for (var i = 0; i < ids.length; i++) { if (String(ids[i][0]) === String(d.entry.entryId)) { at = i + 2; break; } }\n'+
'    if (at > 0) sh.getRange(at, 1, 1, row.length).setValues([row]);\n'+
'    else sh.appendRow(row);\n'+
'    return out({ ok: true, entryId: d.entry.entryId, updated: at > 0 });\n'+
'  } catch (err) {\n'+
'    return out({ ok: false, error: String(err) });\n'+
'  } finally {\n'+
'    lock.releaseLock();\n'+
'  }\n'+
'}\n'+
'function doGet() { return out({ ok: true, message: "SurveyScholar endpoint is live" }); }\n'+
'function out(o) {\n'+
'  return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON);\n'+
'}\n';

function FunctionsPage(p){
  var s1=useState(p.settings.interviewer||''), name=s1[0], setName=s1[1];
  var s2=useState(p.settings.sheetUrl||''), url=s2[0], setUrl=s2[1];
  var s3=useState(false), help=s3[0], setHelp=s3[1];
  var s4=useState(''), status=s4[0], setStatus=s4[1];
  var s5=useState(false), busy=s5[0], setBusy=s5[1];
  var s6=useState(false), guide=s6[0], setGuide=s6[1];
  var fileRef=useRef(null);

  useEffect(function(){ setName(p.settings.interviewer||''); setUrl(p.settings.sheetUrl||''); },
    [p.settings.interviewer,p.settings.sheetUrl]);

  function saveName(v){ setName(v); setSetting('interviewer',v).then(p.refresh); }
  function saveUrl(){
    var v=url.trim();
    if(v && !/^https:\/\/script\.google\.com\/.+\/exec/.test(v)){
      UI.confirm({title:'That URL looks unusual',message:'A deployed Apps Script web app URL starts with https://script.google.com/ and ends with /exec. Save it anyway?',okText:'Save anyway'})
        .then(function(yes){ if(yes) setSetting('sheetUrl',v).then(function(){ UI.toast('Sheet link saved'); p.refresh(); }); });
      return;
    }
    setSetting('sheetUrl',v).then(function(){ UI.toast('Sheet link saved'); p.refresh(); });
  }
  function test(){
    if(!url.trim()){ setStatus('Add the web app URL first.'); return; }
    setBusy(true); setStatus('Testing…');
    postToScript(url.trim(),{action:'ping'}).then(function(r){
      setBusy(false); setStatus('Connected. ' + (r.message||''));
    },function(e){
      setBusy(false); setStatus('Failed: '+(e.message||e)+' — check the deployment is set to “Anyone” and the URL ends in /exec.');
    });
  }
  function pending(){ return p.allResponses.filter(function(r){ return r.syncStatus!=='synced'; }).length; }

  function doRestore(file){
    var fr=new FileReader();
    fr.onload=function(){
      var data;
      try{ data=JSON.parse(fr.result); }catch(e){ UI.toast('That file is not readable JSON'); return; }
      UI.confirm({title:'Restore this backup?',
        message:'Entries in the backup will be written over anything with the same ID on this device. Everything else stays.',
        okText:'Merge backup'}).then(function(yes){
          if(!yes) return;
          restoreAll(data,'merge').then(function(){ UI.toast('Backup restored'); p.refresh(); },
            function(e){ UI.toast('Restore failed: '+(e.message||e)); });
        });
    };
    fr.readAsText(file);
  }

  return html`<div className="wrap"><div className="stack" style=${{paddingTop:'14px'}}>
    <div className="card">
      <label className="field"><span className="lbl">Interviewer name</span>
        <input type="text" value=${name} placeholder="Your name" onChange=${function(e){ saveName(e.target.value); }}/></label>
      <p className="tiny muted" style=${{marginTop:'8px'}}>Tagged onto every entry you collect and every export.</p>
    </div>

    <div className="card stack-sm">
      <div className="row-between"><h2>Google Sheet</h2>
        <button className="btn-ghost btn btn-sm" onClick=${function(){ setHelp(true); }}>Setup guide</button></div>
      <label className="field"><span className="lbl small">Web app URL</span>
        <input type="url" inputMode="url" placeholder="https://script.google.com/macros/s/…/exec"
          value=${url} onChange=${function(e){ setUrl(e.target.value); }}/></label>
      <div className="row">
        <button className="btn btn-sm btn-primary" onClick=${saveUrl}>Save link</button>
        <button className="btn btn-sm" disabled=${busy} onClick=${test}>Test connection</button>
      </div>
      ${status?html`<p className="small" style=${{marginTop:'4px'}}>${status}</p>`:null}
    </div>

    <div className="card">
      <div className="row-between"><h2>Sync</h2>
        <span className="badge plain num">${pending()} waiting</span></div>
      <p className="small muted" style=${{marginTop:'6px'}}>Pushes everything not yet confirmed as synced. Safe to run any time — re-sending an entry updates its row rather than duplicating it.</p>
      <button className="btn btn-primary btn-block" style=${{marginTop:'12px'}} onClick=${p.onSyncNow}>Sync now</button>
    </div>

    <div className="card">
      <h2>Appearance</h2>
      <p className="small muted" style=${{marginTop:'6px'}}>Dark is easier on the eyes indoors and at night; light stays readable in direct sun.</p>
      <div className="chips" style=${{marginTop:'12px'}}>
        ${[['system','Follow device'],['light','Light'],['dark','Dark']].map(function(m){
          return html`<button key=${m[0]} className=${'chip'+(p.theme===m[0]?' on':'')}
            onClick=${function(){ p.onTheme(m[0]); }}>${m[1]}</button>`;
        })}
      </div>
    </div>

    <div className="card">
      <div className="row-between"><h2>Guide</h2>
        <button className="btn-ghost btn btn-sm" onClick=${function(){ setGuide(true); }}>Open</button></div>
      <p className="small muted" style=${{marginTop:'6px'}}>Turn a Word or PDF draft questionnaire into a file this app can import, using an AI assistant. Includes the prompt and the blank template.</p>
    </div>

    <div className="card">
      <h2>Backup</h2>
      <p className="small muted" style=${{marginTop:'6px'}}>A full copy of every questionnaire, entry and setting on this device, as one JSON file. Keep one after each day in the field.</p>
      <div className="row" style=${{marginTop:'12px'}}>
        <button className="btn" style=${{flex:1}} onClick=${function(){ backupAll().then(function(){ UI.toast('Backup downloaded'); }); }}>Download backup</button>
        <button className="btn" onClick=${function(){ fileRef.current.click(); }}>Restore</button>
      </div>
      <input ref=${fileRef} type="file" accept="application/json,.json" style=${{display:'none'}}
        onChange=${function(e){ var f=e.target.files&&e.target.files[0]; if(f) doRestore(f); e.target.value=''; }}/>
    </div>

    <div className="card">
      <h2>About</h2>
      <p className="small muted" style=${{marginTop:'6px'}}>
        SurveyScholar keeps everything in this browser's database on this device. Clearing site data or uninstalling
        the app deletes it — the backup file is your safety net. Entry IDs are ${new Date().getFullYear().toString().slice(-2)}00001 upward and reset each January.
      </p>
      <p className="tiny muted num" style=${{marginTop:'8px'}}>
        ${p.questionnaires.length} questionnaires · ${liveOnly(p.allResponses).length} entries${p.allResponses.length-liveOnly(p.allResponses).length>0?(' · '+(p.allResponses.length-liveOnly(p.allResponses).length)+' deleted, kept '+PURGE_DAYS+' days'):''}${p.installable?' · installable':''}
      </p>
      ${p.installable?html`<button className="btn btn-block" style=${{marginTop:'10px'}} onClick=${p.onInstall}>Add to home screen</button>`:null}
    </div>
  </div>
  ${help?html`<${HelpSheet} onClose=${function(){ setHelp(false); }}/>`:null}
  ${guide?html`<${GuideSheet} onClose=${function(){ setGuide(false); }}/>`:null}
  </div>`;
}

/* ============================ App shell ============================ */
var TABS=[['input','Input','input'],['overview','Overview','chart'],['questionnaire','Questionnaire','form'],['functions','Functions','gear']];

function App(){
  var s1=useState(location.hash.replace('#/','')||'input'), route=s1[0], setRoute=s1[1];
  var s2=useState(null), data=s2[0], setData=s2[1];
  var s3=useState(null), toast=s3[0], setToast=s3[1];
  var s4=useState(null), confirmState=s4[0], setConfirmState=s4[1];
  var s5=useState(false), syncing=s5[0], setSyncing=s5[1];
  var s6=useState(null), deferredPrompt=s6[0], setDeferred=s6[1];
  var s7=useState(navigator.onLine), online=s7[0], setOnline=s7[1];
  var s8=useState(readTheme()), theme=s8[0], setTheme=s8[1];
  var toastTimer=useRef(null);

  var refresh=useCallback(function(){
    return Promise.all([dbAll('questionnaires'),dbAll('responses'),getSettings()]).then(function(r){
      var qs=r[0].sort(function(a,b){ return (a.createdAt||'')<(b.createdAt||'')?-1:1; });
      setData({questionnaires:qs, responses:r[1], settings:r[2]});
      return r;
    });
  },[]);

  UI.toast=function(msg){
    setToast(msg);
    if(toastTimer.current) clearTimeout(toastTimer.current);
    toastTimer.current=setTimeout(function(){ setToast(null); },3200);
  };
  UI.confirm=function(opts){
    return new Promise(function(res){ setConfirmState({opts:opts, done:function(v){ setConfirmState(null); res(v); }}); });
  };

  useEffect(function(){
    repairCounters()
      .then(getSettings)
      .then(function(st){ return purgeOldDeleted(!!st.sheetUrl); })
      .then(refresh).catch(function(e){
      setData({questionnaires:[],responses:[],settings:{interviewer:'',sheetUrl:'',activeQuestionnaireId:null},dbError:String(e)});
    });
    var onHash=function(){ setRoute(location.hash.replace('#/','')||'input'); };
    var onOn=function(){ setOnline(true); }, onOff=function(){ setOnline(false); };
    var onBip=function(e){ e.preventDefault(); setDeferred(e); };
    window.addEventListener('hashchange',onHash);
    window.addEventListener('online',onOn); window.addEventListener('offline',onOff);
    window.addEventListener('beforeinstallprompt',onBip);
    if(!location.hash) location.hash='#/input';
    applyTheme(readTheme());
    var mq=window.matchMedia?window.matchMedia('(prefers-color-scheme: dark)'):null;
    var onScheme=function(){ setTheme(function(t){ if(t==='system') applyTheme('system'); return t; }); };
    if(mq&&mq.addEventListener) mq.addEventListener('change',onScheme);
    return function(){
      if(mq&&mq.removeEventListener) mq.removeEventListener('change',onScheme);
      window.removeEventListener('hashchange',onHash);
      window.removeEventListener('online',onOn); window.removeEventListener('offline',onOff);
      window.removeEventListener('beforeinstallprompt',onBip);
    };
  },[]);

  var setActive=useCallback(function(id){
    setSetting('activeQuestionnaireId',id).then(refresh);
  },[refresh]);

  var runSync=useCallback(function(silent){
    if(syncing) return Promise.resolve();
    setSyncing(true);
    return syncPending(function(done,total){ if(!silent) UI.toast('Syncing '+done+' of '+total+'…'); })
      .then(function(r){
        setSyncing(false);
        if(!silent||r.fail>0){
          if(r.total===0) UI.toast('Everything is already synced');
          else if(r.fail===0) UI.toast(r.ok+' '+(r.ok===1?'entry':'entries')+' synced');
          else UI.toast(r.ok+' synced, '+r.fail+' failed — they stay on the device, tap Sync now to retry');
        }
        return refresh();
      },function(e){
        setSyncing(false);
        if(!silent) UI.toast(e.message||String(e));
      });
  },[syncing,refresh]);

  var trySync=useCallback(function(){
    if(!data||!data.settings.sheetUrl||!navigator.onLine) return;
    runSync(true);
  },[data,runSync]);

  if(!data) return html`<div className="wrap"><p className="muted" style=${{padding:'40px 0'}}>Opening your data…</p></div>`;

  var active=data.questionnaires.filter(function(q){ return q.id===data.settings.activeQuestionnaireId; })[0]
    || data.questionnaires[0] || null;
  var activeAll=active?data.responses.filter(function(r){ return r.questionnaireId===active.id; }):[];
  var activeResponses=liveOnly(activeAll);
  var countsByQ={};
  liveOnly(data.responses).forEach(function(r){ countsByQ[r.questionnaireId]=(countsByQ[r.questionnaireId]||0)+1; });
  var pendingCount=data.responses.filter(function(r){ return r.syncStatus!=='synced'; }).length;

  var page;
  if(route==='overview') page=html`<${OverviewPage} questionnaires=${data.questionnaires} allResponses=${data.responses}
      settings=${data.settings} onSyncNow=${function(){ runSync(false); }}/>`;
  else if(route==='questionnaire') page=html`<${QuestionnairePage} questionnaires=${data.questionnaires}
      settings=${data.settings} countsByQ=${countsByQ} refresh=${refresh} onSetActive=${setActive}/>`;
  else if(route==='functions') page=html`<${FunctionsPage} settings=${data.settings} allResponses=${data.responses}
      questionnaires=${data.questionnaires} refresh=${refresh} onSyncNow=${function(){ runSync(false); }}
      theme=${theme} onTheme=${function(m){ setTheme(applyTheme(m)); }}
      installable=${!!deferredPrompt} onInstall=${function(){ if(deferredPrompt){ deferredPrompt.prompt(); setDeferred(null); } }}/>`;
  else page=html`<${InputPage} questionnaires=${data.questionnaires} active=${active} responses=${activeResponses}
      allResponses=${activeAll} settings=${data.settings} refresh=${refresh} onSetActive=${setActive} trySync=${trySync}/>`;

  return html`<${React.Fragment}>
    <header className="topbar"><div className="topbar-in">
      <span className="brand">Survey<span>Scholar</span></span>
      <div style=${{flex:1}}></div>
      ${!online?html`<span className="badge local"><i className="dot"></i>Offline</span>`:
        (pendingCount>0?html`<span className="badge local num"><i className="dot"></i>${pendingCount} to sync</span>`:null)}
      ${syncing?html`<span className="badge plain">Syncing…</span>`:null}
      <button className="iconbtn theme-btn" onClick=${function(){ setTheme(applyTheme(effectiveTheme(theme)==='dark'?'light':'dark')); }}
        aria-label=${effectiveTheme(theme)==='dark'?'Switch to light theme':'Switch to dark theme'}>
        <${Icon} n=${effectiveTheme(theme)==='dark'?'sun':'moon'}/><//>
    </div></header>

    ${page}

    <nav className="tabs"><div className="tabs-in">
      ${TABS.map(function(t){
        return html`<button key=${t[0]} className="tab" aria-current=${route===t[0]?'page':undefined}
          onClick=${function(){ location.hash='#/'+t[0]; }}>
          <${Icon} n=${t[2]}/><span>${t[1]}</span></button>`;
      })}
    </div></nav>

    ${toast?html`<div className="toast" role="status">${toast}</div>`:null}
    ${confirmState?html`<${Confirm} opts=${confirmState.opts} onDone=${confirmState.done}/>`:null}
  <//>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);

if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('sw.js').catch(function(){ /* not served from a path with sw.js — fine */ });
  });
}
})();
</script>
</body>
</html>
